<title>Esquadrão FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;700;800;900&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: single-column phone-first app shell — sticky header, scrolling view, fixed bottom tab bar; overlays for packs, matches and lances. Night-stadium look, single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0a1511; --panel:#11201a; --panel2:#172b23; --line:#244036; --fg:#eef4ee; --muted:#8aa596;
  --gold:#e8c35f; --gold-d:#a67c1c; --good:#56d086; --bad:#f06a5a; --warn:#f2b640; --opp:#e2574c;
  --pitch-a:#1c5b39; --pitch-b:#195234; --chalk:rgba(255,255,255,.5);
  --f-disp:'Saira Extra Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Saira','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  background-image:radial-gradient(ellipse 70% 40% at 15% -5%,rgba(255,255,255,.07),transparent 70%),radial-gradient(ellipse 70% 40% at 85% -5%,rgba(255,255,255,.06),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#app{max-width:540px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px;background:linear-gradient(var(--bg) 75%,transparent)}
.crest{width:34px;height:40px;flex:none;clip-path:polygon(50% 0,100% 12%,100% 60%,50% 100%,0 60%,0 12%);background:linear-gradient(160deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;color:#1a1204;font-size:18px}
.top h1{font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-weight:800;font-size:20px;background:var(--panel);border:1px solid var(--line);padding:4px 12px 4px 6px;border-radius:99px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c2,var(--gold) 45%,var(--gold-d));box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(10,21,17,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:135px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="true"]{color:var(--gold)}
h2{font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:linear-gradient(180deg,#f2d27a,var(--gold) 40%,#c89a2f);color:#1d1403;border-color:#f5dd95;font-weight:700}
.btn.danger{background:#3a1814;border-color:#6b2a22;color:#ffc9c0}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:#1d1403;border-color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

/* ---------- Cards ---------- */
.card{--w:64px;position:relative;width:var(--w);height:calc(var(--w)*1.42);font-size:calc(var(--w)*.155);flex:none;
  clip-path:polygon(50% 0,100% 5%,100% 90%,50% 100%,0 90%,0 5%);color:var(--ct);background:var(--cbg);user-select:none;-webkit-user-select:none}
.card::after{content:"";position:absolute;inset:0;background:var(--cpat,none);pointer-events:none;mix-blend-mode:overlay}
.card.md{--w:96px}.card.lg{--w:190px}.card.xl{--w:230px}
.c-top{position:absolute;left:8%;top:11%;display:flex;flex-direction:column;align-items:center;gap:.1em;z-index:2}
.c-ovr{font-family:var(--f-disp);font-weight:900;font-size:2.35em;line-height:.85}
.c-pos{font-family:var(--f-disp);font-weight:700;font-size:1.05em;line-height:1}
.flag{display:block;width:1.45em;height:.95em;background:linear-gradient(90deg,var(--a) 33.3%,var(--b) 0 66.6%,var(--c) 0);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.badge{display:grid;place-items:center;width:1.35em;height:1.55em;clip-path:polygon(50% 0,100% 15%,100% 62%,50% 100%,0 62%,0 15%);background:linear-gradient(90deg,var(--a) 50%,var(--b) 0);font-family:var(--f-disp);font-weight:900;font-size:.8em;color:transparent}
.c-face{position:absolute;right:4%;top:8%;width:66%;height:58%}
.c-face svg{width:100%;height:100%;display:block}
.c-name{position:absolute;left:4%;right:4%;top:64%;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:1.25em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;border-top:1px solid color-mix(in srgb,var(--ct) 30%,transparent);padding-top:.15em}
.c-stats{position:absolute;left:10%;right:10%;top:74%;display:grid;grid-template-columns:repeat(3,1fr);gap:.1em .4em;font-family:var(--f-disp);font-size:.78em;line-height:1.05;text-align:center}
.c-stats b{font-weight:900;font-size:1.25em;display:block}
.card.sm .c-stats,.card.md .c-stats{display:none}
.card.sm .c-name{top:72%;font-size:1.3em}
.card.md .c-name{top:70%;font-size:1.2em}
.c-tag{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:.62em;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.card.sm .c-tag{display:none}
.t-bronze{--cbg:linear-gradient(160deg,#c68b5a,#7d4c2b 58%,#b1754a);--ct:#2b1407}
.t-prata{--cbg:linear-gradient(160deg,#f0f3f5,#9ba5ad 58%,#d5dbdf);--ct:#1c2328}
.t-ouro{--cbg:linear-gradient(160deg,#fbe595,#c9982d 56%,#efcf6f);--ct:#2a1c04}
.t-dest{--cbg:linear-gradient(160deg,#26252b,#0f0f12 55%,#35302a);--ct:#f0cf6a;--cpat:repeating-linear-gradient(115deg,transparent 0 9px,rgba(240,207,106,.14) 9px 11px)}
.t-heroi{--cbg:linear-gradient(160deg,#7a1222,#cf432f 52%,#4c0a15);--ct:#fff1e2;--cpat:radial-gradient(circle at 70% 20%,rgba(255,220,150,.45),transparent 45%)}
.t-fc{--cbg:linear-gradient(160deg,#0d5b61,#13b3a8 52%,#093a47);--ct:#eafffa;--cpat:repeating-radial-gradient(circle at 80% 30%,transparent 0 7px,rgba(255,255,255,.12) 7px 8px)}
.t-elite{--cbg:linear-gradient(160deg,#0a1c58,#2f5ee0 52%,#08163f);--ct:#ffe7a1;--cpat:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,231,161,.14) 6px 7px),repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,231,161,.1) 6px 7px)}
.t-lenda{--cbg:linear-gradient(160deg,#fffaf0,#d9c28a 55%,#f6ecd2);--ct:#3a2a08;--cpat:conic-gradient(from 200deg at 70% 25%,rgba(255,255,255,.6),transparent 20%,rgba(255,255,255,.4) 40%,transparent 60%)}
.dup{position:absolute;top:2px;right:0;left:0;margin:auto;width:max-content;z-index:3;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.06em}

/* ---------- Squad ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.stat b{font-family:var(--f-disp);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:5px;margin-top:10px}
.bar{display:grid;grid-template-columns:36px 1fr 30px;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.bar i{display:block;height:7px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));border-radius:9px}
.bar span{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.pitch{container-type:inline-size;position:relative;width:100%;aspect-ratio:100/128;margin-top:12px;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 10%,var(--pitch-b) 10% 20%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}
.slot .card{--w:15.5cqw}
.slot.empty .ph{width:15.5cqw;height:22cqw;border:2px dashed var(--chalk);border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:var(--chalk);font-size:4cqw}
.slot .lbl{font-size:max(9px,2.4cqw);font-weight:700;background:rgba(0,0,0,.55);padding:0 5px;border-radius:4px;display:flex;align-items:center;gap:3px}
.pips{display:inline-flex;gap:2px}.pips i{width:5px;height:5px;transform:rotate(45deg);background:rgba(255,255,255,.25)}.pips i.on{background:var(--good)}
.slot .lbl.oop{color:var(--warn)}
.bench{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:thin}
.bench .slot{position:static;transform:none}
.bench .slot .card{--w:58px}
.bench .slot.empty .ph{width:58px;height:82px;font-size:13px}
.style-desc{font-size:13px;color:var(--muted);margin-top:6px;min-height:2.8em}

/* ---------- Sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:540px;max-height:86%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s}
.sheet h2{margin-top:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:6px 8px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.prow:hover{border-color:var(--line)}
.prow .card{--w:44px}
.prow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .meta{font-size:12px;color:var(--muted)}
.prow .right{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .right b{font-family:var(--f-disp);font-size:20px;color:var(--fg)}
.up{color:var(--good)}.down{color:var(--bad)}

/* ---------- Club / store ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;justify-items:center}
.grid .card{--w:88px}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pack{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}
.foil{height:118px;border-radius:10px;position:relative;overflow:hidden;background:var(--pbg);display:flex;align-items:flex-end;padding:10px;color:var(--pt)}
.foil::before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-60%);animation:shine 3.2s infinite}
@keyframes shine{to{transform:translateX(60%)}}
.foil b{font-family:var(--f-disp);font-weight:900;font-size:26px;line-height:.9;text-transform:uppercase;position:relative}
.pack .price{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-weight:800;font-size:20px}
.pack .price .coin{width:16px;height:16px}
.pack p{margin:0;font-size:12.5px;color:var(--muted);min-height:3.6em}
.p-bronze{--pbg:linear-gradient(150deg,#c68b5a,#6e4024);--pt:#2b1407}
.p-prata{--pbg:linear-gradient(150deg,#f0f3f5,#8e98a0);--pt:#1c2328}
.p-ouro{--pbg:linear-gradient(150deg,#fbe595,#b8861f);--pt:#2a1c04}
.p-premium{--pbg:linear-gradient(150deg,#fbe595,#c9982d 45%,#1b1b1f 46%,#2c2a24);--pt:#f0cf6a}
.p-especial{--pbg:linear-gradient(150deg,#cf432f,#13b3a8 50%,#2f5ee0);--pt:#fff}
.p-lenda{--pbg:linear-gradient(150deg,#fffaf0,#d9c28a);--pt:#3a2a08}
.p-free{--pbg:repeating-linear-gradient(135deg,#1c5b39 0 12px,#195234 12px 24px);--pt:#fff}

/* ---------- Pack opening ---------- */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 30%,#1b3129,#050b09 70%);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));animation:fade .2s}
.ov-inner{max-width:540px;margin:0 auto}
.walk{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:#050908;overflow:hidden;cursor:pointer}
.walk .beam{position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 60%,transparent 0 40deg,var(--glow) 50deg,transparent 60deg 150deg,var(--glow) 160deg,transparent 170deg 250deg,var(--glow) 262deg,transparent 272deg);opacity:.35;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.walk .step{position:relative;text-align:center;font-family:var(--f-disp);font-weight:900;text-transform:uppercase;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.walk .step .big{font-size:72px;line-height:.9;letter-spacing:.02em}
.walk .step .flagbig{width:150px;height:96px;margin:0 auto 14px;background:linear-gradient(90deg,var(--a) 33.3%,var(--b) 0 66.6%,var(--c) 0);box-shadow:0 0 60px var(--glow)}
.walk .step .crestbig{width:110px;height:130px;margin:0 auto 14px;clip-path:polygon(50% 0,100% 12%,100% 62%,50% 100%,0 62%,0 12%);background:linear-gradient(90deg,var(--a) 50%,var(--b) 0)}
.walk .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.reveal .card{animation:flip .5s both}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}}

/* ---------- Season ---------- */
.fixture{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.team-crest{width:54px;height:64px;margin:0 auto 6px;clip-path:polygon(50% 0,100% 12%,100% 62%,50% 100%,0 62%,0 12%);background:linear-gradient(90deg,var(--a) 50%,var(--b) 0);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 2px #000}
.fixture .nm{font-family:var(--f-disp);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1.05}
.vs{font-family:var(--f-disp);font-weight:900;font-size:30px;color:var(--muted)}
.tip{margin-top:12px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 5px;font-weight:600}
td{padding:7px 5px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{text-align:center;width:28px}
tr.you td{background:rgba(232,195,95,.1);font-weight:700}
.zone-up{box-shadow:inset 3px 0 0 var(--good)}.zone-down{box-shadow:inset 3px 0 0 var(--bad)}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:13px;padding:4px 0}
.res span:first-child{text-align:right}

/* ---------- Match ---------- */
.match{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 10px;border-radius:16px;background:linear-gradient(180deg,#14261f,#0d1a15);border:1px solid var(--line)}
.board .tn{font-family:var(--f-disp);font-weight:800;font-size:17px;text-transform:uppercase;text-align:center;line-height:1.05}
.score{font-family:var(--f-disp);font-weight:900;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums;text-align:center}
.clock{display:block;text-align:center;font-family:var(--f-disp);font-weight:700;color:var(--gold);font-size:18px}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.scorers div:last-child{text-align:right}
.mctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.mctl .chip{padding:6px 10px}
.feed{display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow:auto;padding-right:4px}
.ev{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--panel)}
.ev .m{font-family:var(--f-disp);font-weight:700;color:var(--muted);text-align:right}
.ev.goal{background:linear-gradient(90deg,rgba(232,195,95,.28),var(--panel));font-weight:700}
.ev.goal.opp{background:linear-gradient(90deg,rgba(226,87,76,.28),var(--panel))}
.ev.card-y .t::before{content:"";display:inline-block;width:9px;height:12px;background:#f5d000;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ev.card-r .t::before{content:"";display:inline-block;width:9px;height:12px;background:#e53935;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ev.info{background:transparent;color:var(--muted);font-size:13px}
.ev.lance{border:1px solid var(--gold)}
.mstats{display:grid;gap:8px;margin-top:12px}
.ms{display:grid;grid-template-columns:28px 1fr 28px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.ms .lab{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:-6px}
.ms .dual{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.ms .dual b{background:var(--gold)}.ms .dual i{background:var(--opp);margin-left:auto}
.ms span:last-child{text-align:right}
.ht{margin:12px 0;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--gold)}

/* ---------- Lance (moment) ---------- */
.moment{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));animation:fade .2s;overflow:auto}
.mo-head{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mo-tag{font-family:var(--f-disp);font-weight:900;background:var(--gold);color:#1d1403;padding:2px 8px;border-radius:6px;font-size:16px}
.mo-head b{font-family:var(--f-disp);font-weight:800;font-size:22px;text-transform:uppercase;flex:1}
.mo-head .acts{font-size:12px;color:var(--muted);text-align:right}
.moment canvas{touch-action:none;border-radius:12px;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}

    let name,short,tries=0;
    do{ if(nat==='BRA'&&r()<.42){name=short=pick(pool.nick,r)}else{const f=pick(pool.f,r),l=pick(pool.l,r);name=f+' '+l;short=l} }while(used.has(name)&&++tries<20);

    const st=PROFILE[pos].map(w=>clamp(Math.round(ovr+(w-.9)*40+(r()*8-4)),20,99));
    out.push({id:i,name,short,nat,pos,alt:alts,ovr,lg:lg.id,club,age,st});
  }
  return out;
}

function calcChem(xi,form){
  const slots=slotsOf(form), club={},nat={},lg={}; let legs=0;
  xi.forEach(P=>{ if(!P) return; if(P.leg){legs++;nat[P.nat]=(nat[P.nat]||0)+2;return}
    const k=P.lg+':'+P.club; club[k]=(club[k]||0)+1; lg[P.lg]=(lg[P.lg]||0)+1; nat[P.nat]=(nat[P.nat]||0)+1;});
  const per=xi.map((P,i)=>{ if(!P||!inPos(P,slots[i].p)) return 0; if(P.leg) return 3;
    const cc=club[P.lg+':'+P.club], nc=nat[P.nat], lc=lg[P.lg]+legs;
    let c=(cc>=7?3:cc>=4?2:cc>=2?1:0)+(nc>=8?3:nc>=5?2:nc>=2?1:0)+(lc>=8?3:lc>=5?2:lc>=3?1:0);
    return Math.min(3,c);});
  return {per,total:per.reduce((a,b)=>a+b,0)};
}

function refW(W){return slotsOf('4-3-3').reduce((s,x)=>s+W[x.p],0)}
const REF={att:refW(W_ATT),def:refW(W_DEF),mid:refW(W_MID)};
function rate(entries){ // entries [{pos,eff,red}]
  const f=(W,ref)=>{let s=0,w=0;for(const e of entries){if(e.red)continue;const k=W[e.pos];s+=e.eff*k;w+=k}return w?(s/w)*Math.pow(w/ref,.3):30};
  const gk=entries.find(e=>e.pos==='GOL'&&!e.red);
  const reds=entries.filter(e=>e.red).length, pen=Math.pow(.95,reds);
  return {att:f(W_ATT,REF.att)*pen,def:f(W_DEF,REF.def)*pen,mid:f(W_MID,REF.mid)*pen,gk:gk?gk.eff:30};
}

function newGame(){
  S={v:1,t:Date.now(),name:'Esquadrão FC',coins:5000,uid:1,cards:[],squad:{form:'4-3-3',xi:Array(11).fill(0),bench:Array(7).fill(0)},
     tac:{style:'equilibrado',ment:2},season:null,rec:{w:0,d:0,l:0,gf:0,ga:0,packs:0},lastFree:'',moments:true,titles:0};
  const need=['GOL','GOL','ZAG','ZAG','ZAG','LD','LE','VOL','MC','MC','MEI','PE','PD','ATA','ATA','ME','MD','LD'];
  const got=new Set();
  for(const pos of need){
    const cand=POOL.filter(p=>p.pos===pos&&p.ovr>=57&&p.ovr<=66&&!got.has(p.id));
    const p=pick(cand); got.add(p.id); addCard(p.id,'base');
  }
  autoLineup(); S.season=newSeason(0);
}
function addCard(p,v){const c={u:S.uid++,p,v};S.cards.push(c);return c}
const cardByUid=u=>{const c=S.cards.find(c=>c.u===u);return c?Object.assign({u},cardData(c.p,c.v)):null};
function xiCards(){return S.squad.xi.map(u=>u?cardByUid(u):null)}
function autoLineup(){
  const slots=slotsOf(S.squad.form); const all=S.cards.map(c=>Object.assign({u:c.u},cardData(c.p,c.v)));
  const usedU=new Set(), usedP=new Set(), xi=Array(11).fill(0);
  const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a].p==='GOL'?-1:0)-(slots[b].p==='GOL'?-1:0));
  for(const pass of [0,1,2]) for(const i of order){ if(xi[i]) continue; const pos=slots[i].p;
    let best=null,bv=-1;
    for(const P of all){ if(usedU.has(P.u)||usedP.has(P.id)) continue;
      const ok=pass===0?P.pos===pos:pass===1?inPos(P,pos):true; if(!ok) continue;
      const v=effOvr(P,pos,1)+(P.pos===pos?.5:0); if(v>bv){bv=v;best=P} }
    if(best){xi[i]=best.u;usedU.add(best.u);usedP.add(best.id)} }
  S.squad.xi=xi;
  const rest=all.filter(P=>!usedU.has(P.u)).sort((a,b)=>b.ovr-a.ovr);
  const bench=[]; const bp=new Set();
  if(!rest.some(P=>P.pos==='GOL')) {} else {const g=rest.find(P=>P.pos==='GOL');bench.push(g.u);bp.add(g.id)}
  for(const P of rest){ if(bench.length>=7) break; if(bp.has(P.id)||usedP.has(P.id)||bench.includes(P.u)) continue; bench.push(P.u);bp.add(P.id)}
  while(bench.length<7) bench.push(0);
  S.squad.bench=bench;
}
function teamInfo(){
  const xi=xiCards(), form=S.squad.form, slots=slotsOf(form), chem=calcChem(xi,form);
  const entries=slots.map((s,i)=>({pos:s.p,eff:effOvr(xi[i],s.p,chem.per[i])}));
  const filled=xi.filter(Boolean);
  const ovr=filled.length?Math.round(filled.reduce((a,P)=>a+P.ovr,0)/11):0;
  return {xi,chem,slots,r:rate(entries),ovr,full:filled.length===11};
}

/* ============ Season logic ============ */
function roundRobin(n){const a=[...Array(n).keys()],rounds=[];for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++)pr.push([a[i],a[n-1-i]]);rounds.push(pr);a.splice(1,0,a.pop())}return rounds}
function newSeason(div,num=1){
  const D=DIVS[div]; const clubs=shuffle(ALL_CLUBS).slice(0,9);
  const teams=[{you:true,n:'',s:'',c1:'',c2:''},...clubs.map(c=>({n:c.n,s:c.s,c1:c.c1,c2:c.c2,lg:c.lg,str:D.s+ri(-4,4),form:pick(Object.keys(FORMS)),style:pick(Object.keys(STYLES))}))];
  teams.forEach(t=>Object.assign(t,{P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0}));
  return {div,num,round:0,teams,fx:shuffle(roundRobin(10)),last:[]};
}
function standings(se){return se.teams.map((t,i)=>Object.assign({},t,{i,n:t.you?S.name:t.n})).sort((a,b)=>b.Pts-a.Pts||(b.GF-b.GA)-(a.GF-a.GA)||b.GF-a.GF)}
function applyResult(t,gf,ga){t.P++;t.GF+=gf;t.GA+=ga;if(gf>ga){t.W++;t.Pts+=3}else if(gf===ga){t.D++;t.Pts++}else t.L++}
function quickSim(a,b){const d=(a-b)*.07;return [poisson(1.35*Math.exp(d)),poisson(1.35*Math.exp(-d))]}
function finishRound(gYou,gOpp){
  const se=S.season, pairs=se.fx[se.round]; se.last=[];
  for(const [x,y] of pairs){
    let gx,gy;
    if(x===0||y===0){ const you=x===0; gx=you?gYou:gOpp; gy=you?gOpp:gYou; }
    else [gx,gy]=quickSim(se.teams[x].str,se.teams[y].str);
    applyResult(se.teams[x],gx,gy);applyResult(se.teams[y],gy,gx);se.last.push([x,y,gx,gy]);
  }
  se.round++;
}
function endSeason(){
  const se=S.season, table=standings(se), pos=table.findIndex(t=>t.you)+1, D=DIVS[se.div];
  const coins=Math.round([15000,10000,7500,5000,4000,3000,2500,2000,1500,1000][pos-1]*D.m);
  S.coins+=coins; let nd=se.div, msg=`${pos}º lugar: +${fmt(coins)} moedas.`;
  if(pos<=3&&se.div<4){nd++;msg+=` Acesso para a ${DIVS[nd].n}!`}
  else if(pos===1&&se.div===4){S.titles++;msg+=' Campeão da Elite Mundial!'}
  else if(pos>=9&&se.div>0){nd--;msg+=` Rebaixado para a ${DIVS[nd].n}.`}
  const packId=pos===1?'premium':pos<=3?'ouro':null;
  S.season=newSeason(nd,se.num+1); save(); render();
  openSheet(`<h2>Fim de temporada</h2><p>${msg}</p>${packId?`<p>Prêmio extra: pacote <b>${PACKS.find(p=>p.id===packId).n}</b>.</p><button class="btn pri block" data-act="freePack" data-p="${packId}">Abrir pacote</button>`:'<button class="btn block" data-act="closeSheet">Fechar</button>'}`);
}

/* ============ Packs ============ */
function drawRange(min,max){
  const cand=POOL.filter(p=>p.ovr>=min&&p.ovr<=max);
  const w=cand.map(p=>[p,Math.exp(-(p.ovr-min)*.13)]); return {p:wpick(w).id,v:'base'};
}
function drawSpecial(){
  const r=R(); const v=r<.48?'dest':r<.7?'heroi':r<.9?'fc':'elite';
  const cand=v==='fc'?POOL.filter(p=>p.age<=22&&p.ovr>=64):v==='elite'?POOL.filter(p=>p.ovr>=83):POOL.filter(p=>p.ovr>=(v==='heroi'?74:72));
  return {p:wpick(cand.map(p=>[p,Math.exp(-(p.ovr-70)*.08)])).id,v};
}
function packContents(id){
  const out=[];
  if(id==='bronze'){for(let i=0;i<6;i++)out.push(i===0&&R()<.3?drawRange(65,74):drawRange(47,64))}
  else if(id==='prata'){for(let i=0;i<6;i++)out.push(i===0&&R()<.22?drawRange(75,80):drawRange(65,74))}
  else if(id==='ouro'){for(let i=0;i<8;i++)out.push(drawRange(75,99)); if(R()<.1)out[0]=drawSpecial()}
  else if(id==='premium'){for(let i=0;i<10;i++)out.push(i<3?drawRange(80,99):drawRange(75,99)); if(R()<.3)out[0]=drawSpecial()}
  else if(id==='especial'){out.push(drawSpecial());for(let i=0;i<4;i++)out.push(drawRange(78,99))}
  else if(id==='lenda'){out.push({p:pick(LEGENDS).id,v:'lenda'});for(let i=0;i<3;i++)out.push(drawRange(80,99))}
  return out;
}
function openPack(id){
  const owned=new Set(S.cards.map(c=>c.p+'|'+c.v));
  const got=packContents(id).map(x=>{const dup=owned.has(x.p+'|'+x.v);owned.add(x.p+'|'+x.v);const c=addCard(x.p,x.v);return {c,P:Object.assign({u:c.u},cardData(x.p,x.v)),dup}});
  S.rec.packs++; save(); render();
  got.sort((a,b)=>b.P.ovr-a.P.ovr);
  const best=got[0].P, special=!['bronze','prata','ouro'].includes(best.tier);
  const show=()=>showReveal(got);
  if(best.ovr>=84||special) walkout(best,show); else show();
}
function walkout(P,done){

  const glow={lenda:'#fff3c4',elite:'#6f95ff',heroi:'#ff7a5c',fc:'#3de0cf',dest:'#f0cf6a'}[P.tier]||'#f5d77a';

    `${cardHTML(P,'xl')}<div style="margin-top:14px;font-size:22px;color:${glow}">${esc(P.name)}${P.v!=='base'?' · '+VAR[P.v].n:''}</div>`
  ];

  const next=()=>{clearTimeout(timer); if(i>=3){w.remove();done();return} i++; show(); if(i<3) timer=setTimeout(next,1300)};

function applyPick(u){

 miss:['{p} arrisca de fora da área e manda por cima.','{p} finaliza cruzado, a bola passa raspando a trave.','{p} sobe de cabeça, mas sem direção.','Chute fraco de {p}, a zaga afasta.','{p} tenta a finta e bate torto.'],

 pen:['PÊNALTI! Falta em {p} dentro da área.'],

 yc:['Amarelo para {p} por falta dura.','{p} leva cartão amarelo por reclamação.'],

const tx=(k,o)=>pick(TX[k]).replace(/\{(\w+)\}/g,(_,x)=>o[x]||'');
const SCORE_W={GOL:0,ZAG:.5,LD:.35,LE:.35,VOL:.6,MC:1.2,MEI:2.4,MD:1.5,ME:1.5,PD:3.4,PE:3.4,ATA:5};
const ASSIST_W={GOL:.05,ZAG:.3,LD:.9,LE:.9,VOL:.8,MC:1.5,MEI:2.6,MD:1.8,ME:1.8,PD:2,PE:2,ATA:1.3};
let M=null;
function sideYou(){
  const T=teamInfo();
  const xi=T.slots.map((s,i)=>({P:T.xi[i],pos:s.p,base:effOvr(T.xi[i],s.p,T.chem.per[i]),inMin:0,yc:0,red:false,name:T.xi[i].short}));
  const bench=S.squad.bench.filter(Boolean).map(cardByUid);
  return {you:true,name:S.name,s:(S.name[0]||'E').toUpperCase(),c1:'#e8c35f',c2:'#a67c1c',form:S.squad.form,style:S.tac.style,ment:S.tac.ment-2,xi,bench,subs:5,goals:0,scorers:[]};
}
function poolPick(pos,str,used){
  let c=POOL.filter(p=>!used.has(p.id)&&p.pos===pos&&Math.abs(p.ovr-str)<=5);
  if(!c.length) c=POOL.filter(p=>!used.has(p.id)&&inPos(p,pos));
  const p=pick(c); used.add(p.id); return p;
}
function sideOpp(t){
  const used=new Set(); const slots=slotsOf(t.form);
  const xi=slots.map(s=>{const p=poolPick(s.p,t.str,used);return {P:p,pos:s.p,base:t.str+rn(-2.5,2.5),inMin:0,yc:0,red:false,name:p.short}});
  const bench=['GOL','ZAG','MC','PD','ATA','LD','MEI'].map(pp=>poolPick(pp,t.str-2,used));
  return {you:false,name:t.n,s:t.s,c1:t.c1,c2:t.c2,form:t.form,style:t.style,ment:0,xi,bench,subs:5,goals:0,scorers:[],str:t.str};
}
function effNow(e,min){return e.red?0:e.base*(1-clamp((min-e.inMin-55)/35,0,1)*.08)}
function ratingsOf(side,min){return rate(side.xi.map(e=>({pos:e.pos,eff:effNow(e,min),red:e.red})))}
function startMatch(oppTeam,league){
  const T=teamInfo(); if(!T.full){toast('Complete os 11 titulares antes de jogar');TAB='squad';render();return}
  const A=sideYou(), B=sideOpp(oppTeam);
  const s1=ri(1,3), s2=ri(2,5), seq=[];
  for(let m=1;m<=45;m++)seq.push({m,l:m+"'"}); for(let k=1;k<=s1;k++)seq.push({m:45,l:'45+'+k+"'"}); seq.push({ht:true});
  for(let m=46;m<=90;m++)seq.push({m,l:m+"'"}); for(let k=1;k<=s2;k++)seq.push({m:90,l:'90+'+k+"'"});
  M={A,B,seq,k:0,label:"0'",min:0,ev:[],st:{poss:[0,0],sh:[0,0],on:[0,0],yc:[0,0]},speed:1,paused:false,ht:false,over:false,moments:S.moments?4:0,lastMom:-99,league,oppTeam,momGoals:0,busy:false,aiDone:{}};
  const ov=document.createElement('div'); ov.className='match'; ov.id='match'; document.body.appendChild(ov);
  addEv(0,'info',`${A.name} (${A.form}, ${STYLES[A.style].n}) × ${B.name} (${B.form}, ${STYLES[B.style].n}). Bola rolando!`);
  renderMatch(true); loop();
}
function addEv(side,type,text){M.ev.unshift({l:M.label,side,type,text})}
function loop(){
  if(!M||M.over) return;
  clearTimeout(M.timer);
  if(M.paused||M.ht||M.busy) return;
  M.timer=setTimeout(async()=>{ await tick(); renderMatch(); loop(); },[0,650,300,110][M.speed]);
}
function weightedPlayer(side,W,excl){const c=side.xi.filter(e=>!e.red&&e!==excl).map(e=>[e,(W[e.pos]||.1)*Math.pow(Math.max(e.base,30)/70,3)]);return c.length?wpick(c):side.xi[0]}
async function tick(){
  const it=M.seq[M.k++]; if(!it){endMatch();return}
  if(it.ht){M.ht=true;addEv(0,'info','Fim do primeiro tempo.');return}
  M.min=it.m; M.label=it.l;
  const A=M.A,B=M.B, rA=ratingsOf(A,M.min), rB=ratingsOf(B,M.min);
  // possession
  const pm={posse:.07,retranca:-.08,contra:-.06,pressao:.03,equilibrado:0};
  let pA=Math.pow(rA.mid,5)/(Math.pow(rA.mid,5)+Math.pow(rB.mid,5))+pm[A.style]-pm[B.style]+.015*(A.ment-B.ment);
  pA=clamp(pA,.25,.75); M.st.poss[0]+=pA; M.st.poss[1]+=1-pA;
  const chance=(att,def,poss,sa,sb,ma,mb)=>{let p=.095*Math.pow(poss/.5,.8)*Math.pow(att/def,4)*sv(sa,sb)*(1+.13*ma)*(1+.09*mb);if(sa==='retranca')p*=.75;if(sb==='retranca')p*=.82;return p};
  const cA=chance(rA.att,rB.def,pA,A.style,B.style,A.ment,B.ment), cB=chance(rB.att,rA.def,1-pA,B.style,A.style,B.ment,A.ment);
  if(R()<cA) await shot(A,B,rA,rB,0);
  if(!M.over&&R()<cB) await shot(B,A,rB,rA,1);
  // cards
  for(const [side,si] of [[A,0],[B,1]]){
    const pr=.02*(side.style==='pressao'?1.4:1);
    if(R()<pr){const e=weightedPlayer(side,{GOL:.1,ZAG:1.4,LD:1.1,LE:1.1,VOL:1.5,MC:1,MEI:.6,MD:.8,ME:.8,PD:.5,PE:.5,ATA:.5});
      if(R()<.06){e.red=true;addEv(si,'card-r',tx('rc2',{p:e.name}));}
      else if(e.yc){e.red=true;addEv(si,'card-r',tx('rc',{p:e.name}));}
      else {e.yc=1;M.st.yc[si]++;addEv(si,'card-y',tx('yc',{p:e.name}));}
    }
  }
  aiManage();
}
async function shot(att,def,ra,rd,si){
  const shooter=weightedPlayer(att,SCORE_W);
  const gkE=def.xi.find(e=>e.pos==='GOL'&&!e.red), gk=gkE?gkE.name:'o goleiro';
  const assist=R()<.62?weightedPlayer(att,ASSIST_W,shooter):null;
  M.st.sh[si]++;
  const isPen=R()<.035;
  // interactive moment for user
  if(att.you&&M.moments>0&&M.min-M.lastMom>=10&&(isPen||R()<.34)){
    M.moments--; M.lastMom=M.min; M.busy=true; renderMatch();
    const res=await runMoment({pen:isPen,counter:att.style==='contra'||R()<.25});
    M.busy=false;
    if(res.shot) M.st.on[si]+=res.onTarget?1:0;
    if(res.goal){ att.goals++; att.scorers.push(res.scorer+" "+M.label); M.momGoals++;
      addEv(si,'goal lance',`Lance jogado: GOL de ${res.scorer}!${res.assist?' Passe de '+res.assist+'.':''}`);
    } else addEv(si,'lance',`Lance jogado: ${res.text}`);
    return;
  }
  if(isPen){ addEv(si,'info',tx('pen',{p:shooter.name}));
    if(R()<.78){M.st.on[si]++;att.goals++;att.scorers.push(shooter.name+" "+M.label+" (p)");addEv(si,'goal'+(si?' opp':''),tx('penGoal',{p:shooter.name}))}
    else addEv(si,'info',tx('penMiss',{p:shooter.name,gk}));
    return;
  }
  const q=R(); const fin=effNow(shooter,M.min), gkv=gkE?effNow(gkE,M.min):30;
  let gp=(.05+.16*q*q)*Math.pow(clamp((fin*.6+ra.att*.4)/gkv,.6,1.8),2);
  if(R()<gp){ M.st.on[si]++; att.goals++; att.scorers.push(shooter.name+" "+M.label);
    addEv(si,'goal'+(si?' opp':''),tx('goal',{p:shooter.name,gk})+(assist?` Assistência de ${assist.name}.`:''));
  } else if(R()<.45){M.st.on[si]++; addEv(si,'chance',tx('save',{p:shooter.name,gk}));}
  else if(R()<.08) addEv(si,'chance',tx('post',{p:shooter.name}));
  else if(q>.45) addEv(si,'chance',tx('miss',{p:shooter.name}));
}
function aiManage(){
  const B=M.B, diff=B.goals-M.A.goals, m=M.min;
  if(m>=60&&!M.aiDone.m60){M.aiDone.m60=1; if(diff<0){B.ment=Math.min(2,B.ment+1);addEv(1,'info',`${B.name} adianta as linhas em busca do gol.`)} }
  if(m>=75&&!M.aiDone.m75){M.aiDone.m75=1; if(diff<0){B.ment=2}else if(diff>0){B.ment=Math.max(-2,B.ment-1);addEv(1,'info',`${B.name} recua para segurar o resultado.`)} }
  for(const mm of [62,70,80]) if(m>=mm&&!M.aiDone['s'+mm]&&B.subs>0&&B.bench.length){ M.aiDone['s'+mm]=1;
    const outs=B.xi.filter(e=>!e.red&&e.pos!=='GOL'); const o=outs[Math.floor(R()*outs.length)]; const inn=B.bench.shift(); if(!o||!inn) continue;
    addEv(1,'info',`Substituição no ${B.name}: sai ${o.name}, entra ${inn.short}.`);
    Object.assign(o,{P:inn,name:inn.short,inMin:m,yc:0,base:B.str+rn(-3,2)}); B.subs--; }
}
function endMatch(){
  M.over=true; clearTimeout(M.timer);
  const g=M.A.goals, o=M.B.goals, D=DIVS[S.season.div];
  const res=g>o?'w':g===o?'d':'l';
  let coins=({w:900,d:450,l:250})[res]+g*60+M.momGoals*40; coins=Math.round(coins*D.m*(M.league?1:.5)/10)*10;
  S.coins+=coins; S.rec[res]++; S.rec.gf+=g; S.rec.ga+=o;
  if(M.league) finishRound(g,o);
  save();
  addEv(0,'info','Fim de jogo!');
  M.reward=coins; renderMatch();
}

function openSubs(){
  if(!M) return; const wasPaused=M.paused; M.paused=true; clearTimeout(M.timer);

    const sh=openSheet(out===null?`<h2>Quem sai?</h2><p class="small muted" style="margin-top:-4px">${A.subs} substituições restantes. O cansaço pesa depois dos 55 minutos.</p>
      <div class="plist">${A.xi.map((e,i)=>e.red?'':`<button class="prow" data-sub-out="${i}">${cardHTML(e.P)}<div><div class="nm">${esc(e.P.name)}</div><div class="meta">${e.pos}${e.yc?' · amarelado':''}</div></div><div class="right"><b>${Math.round(effNow(e,M.min))}</b><div>fôlego ${Math.round(100-clamp((M.min-e.inMin-55)/35,0,1)*100*.6)}%</div></div></button>`).join('')}</div>`
    :`<h2>Quem entra no lugar de ${esc(A.xi[out].name)}?</h2><div class="plist">${A.bench.map((P,j)=>`<button class="prow" data-sub-in="${j}">${cardHTML(P)}<div><div class="nm">${esc(P.name)}</div><div class="meta">${P.pos}${P.alt.length?' / '+P.alt.join(' / '):''}${!inPos(P,A.xi[out].pos)?' · <span class="down">fora de posição</span>':''}</div></div><div class="right"><b>${P.ovr}</b></div></button>`).join('')||'<p class="empty-note">Sem reservas disponíveis.</p>'}</div>`);
    sh.addEventListener('click',e=>{
      if(e.target===sh){M.paused=wasPaused;loop();renderMatch();return}

        if(A.xi.some(x=>!x.red&&x!==e0&&x.P.id===P.id)){toast('Esse jogador já está em campo');A.bench.splice(+n.dataset.subIn,0,P);return}
        addEv(0,'info',`Substituição: sai ${e0.name}, entra ${P.short}.`);
        A.bench.push(e0.P);
        const ch=calcChem(A.xi.map(x=>x===e0?P:x.P),A.form).per[A.xi.indexOf(e0)];
        Object.assign(e0,{P,name:P.short,base:effOvr(P,e0.pos,ch),inMin:M.min,yc:0}); A.subs--;
        closeSheet(); M.paused=wasPaused; renderMatch(); loop(); }
    });
  };
  draw();
}

/* ============ Lance (interactive moment) ============ */
function runMoment(opt){
  return new Promise(resolve=>{
    const A=M.A, B=M.B;
    const ov=document.createElement('div'); ov.className='moment';
    ov.innerHTML=`<div class="mo-head"><span class="mo-tag">${M.label}</span><b>${opt.pen?'Pênalti!':opt.counter?'Contra-ataque!':'Chance de ataque'}</b><span class="acts" id="moActs"></span></div>
      <canvas id="moCv"></canvas>
      <div class="mo-help">${opt.pen?'Toque dentro do gol para escolher onde bater. Cantos são mais difíceis de defender e mais fáceis de errar.':'Toque num <b>companheiro</b> para passar · dentro do <b>gol</b> para chutar · no <b>campo</b> para conduzir. Arraste para ver a chance de dar certo e solte para executar.'}</div>
      <div class="mo-msg" id="moMsg"></div>`;
    document.body.appendChild(ov);
    const cv=ov.querySelector('#moCv'), ctx=cv.getContext('2d'), msgEl=ov.querySelector('#moMsg');
    const Wd=Math.min(ov.clientWidth-32,460), U=Wd/68, Y0=-4, Hu=48, Ht=Hu*U, dpr=window.devicePixelRatio||1;
    cv.style.width=Wd+'px'; cv.style.height=Ht+'px'; cv.width=Wd*dpr; cv.height=Ht*dpr; ctx.scale(dpr,dpr);
    const SX=x=>x*U, SY=y=>(y-Y0)*U;
    // Build scene
    const slots=slotsOf(A.form); const depth=opt.counter?rn(4,9):rn(0,4);
    let mates=[], foes=[];
    const gkE=B.xi.find(e=>e.pos==='GOL'&&!e.red); const gkOvr=gkE?effNow(gkE,M.min):35;
    if(opt.pen){
      const sh=weightedPlayer(A,{...SCORE_W,ATA:6,MEI:4});

      foes=[{x:34,y:.6,gk:true}];
    } else {
      A.xi.forEach((e,i)=>{ if(e.red||e.pos==='GOL') return; const s=slots[i]; const r=ROLE(e.pos);
        if(r==='D'&&!((e.pos==='LD'||e.pos==='LE')&&R()<.35)) return;
        let X=3.5+s.x/100*61, Y=s.y>=60?31-(s.y-60)*.6:s.y>=36?30+(60-s.y)*.45:36;
        Y-=depth; mates.push({x:clamp(X+rn(-2,2),3,65),y:clamp(Y+rn(-2,2),6,43),e}); });
      const nOut=opt.counter?3:4, nMid=opt.counter?1:2;
      const ball0=mates.filter(m=>m.y>=22);
      var carrierObj=(ball0.length?pick(ball0):mates.reduce((a,b)=>a.y>b.y?a:b));
      for(let k=0;k<nOut;k++) foes.push({x:clamp(16+k*(36/(nOut-1))+(carrierObj.x-34)*.2+rn(-2,2),4,64),y:rn(11,16)-(opt.counter?0:0)});
      for(let k=0;k<nMid;k++) foes.push({x:clamp(carrierObj.x+rn(-9,9),4,64),y:clamp(carrierObj.y-rn(5,8),8,40)});
      foes.push({x:34,y:.8,gk:true});
    }
    let carrier=opt.pen?mates[0]:carrierObj;
    mates.forEach(m=>{m.tx=m.x;m.ty=m.y}); foes.forEach(f=>{f.tx=f.x;f.ty=f.y});
    const ball={x:carrier.x,y:carrier.y-1,fx:0,fy:0,tx:0,ty:0,t:1,dur:1};
    let actions=opt.pen?1:6, busy=false, hover=null, lastPasser=null, done=false, gkDive=null;
    const stat=(m,k)=>m.e.P.st?m.e.P.st[k]:m.e.base;
    const PAS=m=>stat(m,2), DRI=m=>stat(m,3), FIN=m=>stat(m,1);
    const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    function segD(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
    const field=()=>foes.filter(f=>!f.gk);
    function passP(to){const L=dist(carrier,to);let ok=1;const Rr=2+L*.05-(PAS(carrier)-70)*.02;
      for(const f of foes){const d=segD(f,carrier,to);if(d<Rr)ok*=1-.85*(1-d/Rr)}
      const md=Math.min(...field().map(f=>dist(f,to)),99); if(md<2.4)ok*=.55+.45*md/2.4;
      ok*=clamp(1-Math.max(0,L-24)*.02,.5,1); return clamp(ok,.03,.97)}
    function dribP(to){let ok=1;const d0=clamp(.72-(DRI(carrier)-70)*.012,.25,.9);for(const f of field()){const d=segD(f,carrier,to);if(d<3)ok*=1-d0*(1-d/3)}return clamp(ok*clamp(1-Math.max(0,dist(carrier,to)-6)*.04,.6,1),.03,.97)}

      if(opt.pen){const miss=clamp(.03+Math.pow(edge,3)*.28-(FIN(carrier)-70)*.003,.02,.4);const save=clamp(.45*(1-.6*edge)*(gkOvr/80),.08,.6);return {goal:(1-miss)*(1-save),miss,save,block:0}}
      const miss=clamp(.04+D*.016+Math.pow(edge,3)*.3-(FIN(carrier)-70)*.005,.03,.85);
      let block=0; for(const f of field()){if(segD(f,carrier,{x:ax,y:0})<1.2)block=1-(1-block)*.55}
      let save=clamp((gkOvr/100)*.8*(1-.55*edge)+D*.014-(FIN(carrier)-70)*.004-.1,.05,.95);
      save*=clamp(1-Math.abs(gk.x-ax)/11,.45,1);

    }
    function target(wx,wy){

      if(opt.pen) return null;

      if(best) return {kind:'pass',m:best};
      let dx=wx-carrier.x, dy=wy-carrier.y, L=Math.hypot(dx,dy); if(L<1) return null; const k=Math.min(1,9/L);

    }
    function probOf(t){return t.kind==='pass'?passP(t.m):t.kind==='drib'?dribP(t):shotP(t.ax).goal}
    function flash(text,color){msgEl.textContent=text;msgEl.style.color=color;msgEl.classList.remove('show');void msgEl.offsetWidth;msgEl.classList.add('show')}
    function moveBall(tx,ty,dur){ball.fx=ball.x;ball.fy=ball.y;ball.tx=tx;ball.ty=ty;ball.t=0;ball.dur=dur}
    function finish(res,text,color,wait=1500){ if(done) return; done=true; flash(text,color); setTimeout(()=>{ov.remove();resolve(res)},wait) }
    function react(){
      const c=carrier; const fs=field().slice().sort((a,b)=>dist(a,c)-dist(b,c));

        if(i<2){const k=Math.min(3.4,Math.max(0,d-1.9))/(d||1);f.tx=f.x+(c.x-f.x)*k;f.ty=f.y+(c.y-f.y)*k}
        else {f.tx=f.x+((c.x+34)/2-f.x)*.25; f.ty=clamp(Math.min(f.y,c.y-2.5)-rn(0,1.5),3,42)} });
      const gk=foes.find(f=>f.gk); gk.tx=34+(c.x-34)*.28; gk.ty=clamp(.6+(Math.hypot(c.x-34,c.y)<14?1.4:.4),.5,2.5);
      mates.forEach(m=>{ if(m===c) return; m.tx=clamp(m.x+rn(-1.5,1.5),3,65); m.ty=clamp(m.y-rn(1,3.5),5,44) });
    }
    function act(t){

      if(t.kind==='pass'){ actions--; const ok=R()<p;
        if(ok){ moveBall(t.m.x,t.m.y-1,Math.min(700,220+dist(carrier,t.m)*18)); lastPasser=carrier; setTimeout(()=>{carrier=t.m;react();busy=false;if(actions<=0)finish({goal:false,shot:false,text:'A defesa se fechou e a jogada morreu.'},'Recuou!','#ddd')},Math.min(700,220+dist(carrier,t.m)*18)+80);}
        else { let f=foes.filter(x=>!x.gk).sort((a,b)=>segD(a,carrier,t.m)-segD(b,carrier,t.m))[0]; const mk=field().sort((a,b)=>dist(a,t.m)-dist(b,t.m))[0]; if(mk&&dist(mk,t.m)<segD(f,carrier,t.m)) f=mk;
          const px=f?f.x:t.m.x, py=f?f.y:t.m.y; moveBall(px,py,380); setTimeout(()=>finish({goal:false,shot:false,text:`passe de ${carrier.e.name} interceptado.`},'Interceptado!','#f06a5a'),400) }
      } else if(t.kind==='drib'){ actions--; const ok=R()<p;
        if(ok){ carrier.tx=t.x; carrier.ty=t.y; const T0=performance.now(); moveBall(t.x,t.y-1,520); setTimeout(()=>{carrier.x=t.x;carrier.y=t.y;react();busy=false;if(actions<=0)finish({goal:false,shot:false,text:'A defesa se fechou e a jogada morreu.'},'Recuou!','#ddd')},560); }
        else { const f=field().sort((a,b)=>segD(a,carrier,t)-segD(b,carrier,t))[0]; const mx=(carrier.x+t.x)/2,my=(carrier.y+t.y)/2; carrier.tx=mx;carrier.ty=my; if(f){f.tx=mx;f.ty=my-.8} moveBall(mx,my-.6,400); setTimeout(()=>finish({goal:false,shot:false,text:`${carrier.e.name} foi desarmado.`},'Desarmado!','#f06a5a'),450) }
      } else { // shot
        const sp=shotP(t.ax); const r=R(); const nm=carrier.e.name, as=lastPasser?lastPasser.e.name:null;
        const gk=foes.find(f=>f.gk);
        if(!opt.pen&&r<sp.block){ const f=field().sort((a,b)=>segD(a,carrier,{x:t.ax,y:0})-segD(b,carrier,{x:t.ax,y:0}))[0]; moveBall(f.x,f.y,300); setTimeout(()=>finish({goal:false,shot:true,onTarget:false,text:`chute de ${nm} bloqueado pela zaga.`},'Bloqueado!','#f2b640'),350); }

      requestAnimationFrame(draw);
    }
    if(!opt.pen){react(); mates.forEach(m=>{m.x=m.tx;m.y=m.ty}); foes.forEach(f=>{f.x=f.tx;f.y=f.ty});}
    draw();
  });
}

/* ============ Actions ============ */
const ACT={
  tab(d){TAB=d.t;sel=null;render();window.scrollTo(0,0)},
  slot(d){openPicker('xi',+d.i)},
  bslot(d){openPicker('bench',+d.i)},
  pickP(d){if(sel)applyPick(+d.u)},
  benchClear(d){S.squad.bench[+d.i]=0;sel=null;closeSheet();save();render()},
  auto(){autoLineup();save();render();toast('Melhor time escalado')},
  form(d){S.squad.form=d.f;save();render()},
  style(d){S.tac.style=d.s;save();render()},
  ment(d){S.tac.ment=+d.m;save();render()},
  buy(d){const p=PACKS.find(x=>x.id===d.p); if(S.coins<p.price){toast(`Faltam ${fmt(p.price-S.coins)} moedas`);return} S.coins-=p.price; openPack(p.id)},
  free(){if(S.lastFree===today())return;S.lastFree=today();openPack('prata')},
  freePack(d){closeSheet();openPack(d.p)},
  closeReveal(){document.getElementById('reveal')?.remove();render()},
  sellPackDups(d,el){const us=d.u.split(',').map(Number);let v=0;for(const u of us){const P=cardByUid(u);if(P){v+=sellValue(P);removeCard(u)}}S.coins+=v;save();render();toast(`+${fmt(v)} moedas`);el.remove()},
  sellDups(){const inSq=new Set([...S.squad.xi,...S.squad.bench].filter(Boolean));const seen=new Set();let v=0,n=0;
    for(const c of S.cards.slice().sort((a,b)=>a.u-b.u)){const k=c.p+'|'+c.v;if(seen.has(k)&&!inSq.has(c.u)){v+=sellValue(cardData(c.p,c.v));removeCard(c.u);n++}else seen.add(k)}
    S.coins+=v;save();render();toast(`${n} vendidas: +${fmt(v)} moedas`)},
  card(d){const P=cardByUid(+d.u);const inSq=S.squad.xi.includes(P.u)||S.squad.bench.includes(P.u);const L=P.pos==='GOL'?STAT_G:STAT_L;
    openSheet(`<div style="display:grid;justify-items:center;gap:12px">${cardHTML(P,'lg')}</div>
     <h2 style="margin-top:14px">${esc(P.name)}</h2>
     <div class="small muted">${VAR[P.v].n==='Base'?TIER_N[P.tier]:VAR[P.v].n} · ${P.pos}${P.alt.length?' (também '+P.alt.join(', ')+')':''} · ${P.age} anos</div>
     <div class="small muted">${NATIONS[P.nat].n} · ${P.leg?'Ícones':esc(LG[P.lg].n)} · ${esc(clubOf(P).n)}</div>
     <div class="bars" style="margin-top:12px">${P.st.map((s,i)=>`<div class="bar">${L[i]}<i><b style="width:${s}%"></b></i><span>${s}</span></div>`).join('')}</div>
     <div style="margin-top:16px">${inSq?'<p class="small muted">Está no seu elenco. Tire do time para poder vender.</p>':`<button class="btn danger block" data-act="sell" data-u="${P.u}">Vender por ${fmt(sellValue(P))} moedas</button>`}</div>`)},
  sell(d,el){ if(!el.dataset.ok){el.dataset.ok=1;el.textContent='Toque de novo para confirmar';return}
    const P=cardByUid(+d.u);S.coins+=sellValue(P);removeCard(P.u);closeSheet();save();render();toast(`${P.short} vendido`)},
  cf(d){clubFilter=d.f;render()},
  cs(){clubSort=clubSort==='ovr'?'rec':'ovr';render()},
  rename(){const v=document.getElementById('nameIn').value.trim();if(v){S.name=v.slice(0,24);save();render();toast('Nome salvo')}},
  togMom(){S.moments=!S.moments;save();render()},
  reset(d,el){if(!el.dataset.ok){el.dataset.ok=1;el.textContent='Tem certeza? Toque de novo para apagar tudo';return}newGame();save();TAB='squad';render();toast('Novo clube criado')},
  play(){const se=S.season;const oppI=se.fx[se.round].find(p=>p.includes(0)).find(i=>i!==0);startMatch(se.teams[oppI],true)},
  friendly(){const c=pick(ALL_CLUBS);const T=teamInfo();startMatch({n:c.n,s:c.s,c1:c.c1,c2:c.c2,str:clamp(T.ovr+ri(-3,4),50,92),form:pick(Object.keys(FORMS)),style:pick(Object.keys(STYLES))},false)},
  endSeason(){endSeason()},
  closeSheet(){closeSheet()},
  closeMatch(){document.getElementById('match')?.remove();M=null;TAB='season';render()},
  secondHalf(){M.ht=false;renderMatch();loop()},
  mPause(){M.paused=!M.paused;renderMatch();loop()},
  mSpeed(d){M.speed=+d.s;renderMatch();loop()},
  mMent(d){M.A.ment=clamp(M.A.ment+ +d.d,-2,2);addEv(0,'info',`${M.A.name}: ${MENT[M.A.ment+2].toLowerCase()}.`);renderMatch()},
  subs(){openSubs()},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.getAttribute('aria-disabled')==='true'&&t.dataset.act!=='buy')return;const f=ACT[t.dataset.act];if(f)f(t.dataset,t,e)});

/* ============ Boot ============ */
S=loadLocal(); if(!S){newGame();save()}
render();
initDb();
</script>

# Gera o APK Android a cada push e publica em Releases (tag "esquadrao-apk").
name: APK Android

on:
  push:
    branches: [main, ccr-cb341374-5fzvcp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      # Fotos livres (Wikimedia Commons) dos jogadores: só procura quem ainda não está em data/fotos.json
      - name: Buscar fotos dos jogadores
        continue-on-error: true
        timeout-minutes: 30
        run: npm run fotos

      - name: Testes e validação dos dados
        run: |
          npm test
          npm run validar-dados

      - name: Build web + sincronizar com o Android
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../esquadrao-fc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: esquadrao-fc-apk
          path: esquadrao-fc.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete esquadrao-apk --cleanup-tag --yes || true
          gh release create esquadrao-apk esquadrao-fc.apk \
            --target "$GITHUB_SHA" \
            --title "Esquadrão FC — APK mais recente" \
            --notes "Build #${{ github.run_number }} da branch ${{ github.ref_name }} ($(git log -1 --format=%h)). Baixe o esquadrao-fc.apk no celular e instale (permita 'instalar apps desconhecidos')."

      - name: Guardar as fotos encontradas no repositório
        continue-on-error: true
        run: |
          if ! git diff --quiet -- data/fotos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fotos.json
            git commit -m "Fotos dos jogadores (Wikidata / Wikimedia Commons)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

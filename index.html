<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1511">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Esquadrão FC</title>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="crest" id="crest">E</div>
      <h1 id="clubName">Esquadrão FC</h1>
      <div class="coins"><i class="coin"></i><span id="coins">0</span></div>
    </header>
    <main id="view"><div class="boot">Carregando…</div></main>
  </div>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-t="squad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/><circle cx="12" cy="12" r="3"/></svg>Time</button>
    <button data-act="tab" data-t="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12l1 18H5z"/><path d="M9 7a3 3 0 0 0 6 0"/></svg>Pacotes</button>
    <button data-act="tab" data-t="club"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="8" height="12" rx="1.5"/><rect x="13" y="7" width="8" height="12" rx="1.5"/></svg>Clube</button>
    <button data-act="tab" data-t="season"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg>Temporada</button>
  </nav>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Troco Certo</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<style>
/* Fontes dentro do app (funcionam sem internet). Licença SIL OFL em fonts/. */
@font-face { font-family: "Baloo 2"; font-weight: 600; font-display: swap; src: url("fonts/baloo-2-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 600; font-display: swap; src: url("fonts/nunito-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 700; font-display: swap; src: url("fonts/nunito-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 800; font-display: swap; src: url("fonts/nunito-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "VT323"; font-weight: 400; font-display: swap; src: url("fonts/vt323-latin-400-normal.woff2") format("woff2"); }
/* Layout: uma tela de app estreita (max 440px), clara e colorida para crianças.
   Tema único de propósito (céu claro), igual no modo escuro do celular. */
:root {
  color-scheme: light;
  --bg: #dff2ff;          /* céu */
  --bg-deep: #c3e6ff;
  --surface: #ffffff;
  --ink: #1f2b52;         /* azul-marinho, mais suave que preto */
  --muted: #5a6690;
  --line: #cfdcf0;
  --accent: #22b35e;      /* verde "vai!" */
  --accent-dark: #178a47;
  --accent-ink: #ffffff;
  --sun: #ffc93c;         /* amarelo do treino e das estrelas */
  --sun-dark: #d99a00;
  --pink: #ff6b9a;
  --good: #16924b;
  --warn: #c77700;
  --bad: #e5484d;
  --receipt: #fffdf3;
  --font-display: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* cores das cédulas do Real */
  --n2: #5f7f9c; --n5: #7a5a9a; --n10: #d0453d; --n20: #e79a1f; --n50: #b0773a; --n100: #2f74c0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg) linear-gradient(180deg, var(--bg-deep) 0, var(--bg) 220px) no-repeat;
  color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45; font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 440px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 36px; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; font-weight: 800; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.4rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 800; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
header.top .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; gap: 6px; }
header.top .brand svg { width: 30px; height: 30px; flex: none; }
.back { border: 0; background: var(--surface); border-radius: 999px; width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.3rem; font-weight: 800; line-height: 1; flex: none; box-shadow: 0 3px 0 var(--line); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 0.9rem; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.pause-note { font-size: 0.95rem; color: var(--muted); text-align: center; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
/* Botões "fofinhos": sombra sólida embaixo que afunda ao tocar */
.btn {
  border: 0; border-radius: 18px; padding: 14px 18px; width: 100%;
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; line-height: 1.1;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 5px 0 var(--accent-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; text-decoration: none;
}
.btn small { font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; opacity: 0.9; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
.btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 var(--sun-dark); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-dark); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.small { padding: 10px 14px; font-size: 1.05rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

/* Mascote */
.mascot { width: 96px; height: 96px; flex: none; }
.mascot.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
.talk { display: flex; align-items: center; gap: 12px; }
.bubble { background: var(--surface); border-radius: 18px; padding: 12px 14px; position: relative; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right-color: var(--surface); }

/* Início */
.hero { display: flex; flex-direction: column; gap: 12px; padding-block: 4px; }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0; margin: 0; list-style: none; }
.how li { background: var(--surface); border-radius: 16px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 0.85rem; line-height: 1.25; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.how .ico { font-size: 1.8rem; line-height: 1; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 0.95rem; }
select { font: inherit; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 0; background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); }

/* Cupom */
.receipt {
  background: var(--receipt); border-radius: 14px 14px 4px 4px;
  padding: 14px 16px; display: grid; gap: 4px; position: relative;
  font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 var(--line);
}
.receipt::after { /* serrilhado do cupom */
  content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 8px;
  background: radial-gradient(circle at 6px -2px, transparent 6px, var(--receipt) 6.5px) 0 0 / 12px 8px repeat-x;
}
.receipt .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.receipt .big { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
.receipt .dash { border-top: 2px dashed var(--line); margin-block: 6px; }
.round-dots { display: flex; gap: 6px; }
.round-dots span { flex: 1; height: 10px; border-radius: 5px; background: var(--surface); }
.round-dots span.done { background: var(--accent); }
.round-dots span.now { background: var(--sun); }

/* Bandeja */
.tray { background: var(--surface); border-radius: 18px; padding: 12px; display: grid; gap: 10px; min-height: 108px; box-shadow: 0 3px 0 var(--line); }
.tray-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tray-sum { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.tray-items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }
.tray-items .empty { color: var(--muted); font-size: 0.95rem; align-self: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 0; background: var(--bg); font-weight: 800; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.chip .x { color: var(--muted); }
.tray.shake { animation: shake 0.35s; box-shadow: 0 0 0 3px var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.flash { font-weight: 800; font-size: 0.95rem; min-height: 1.3em; }
.flash.bad { color: var(--bad); }
.flash.good { color: var(--good); }

/* Gaveta do caixa */
.drawer { display: grid; gap: 10px; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.coins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; justify-items: center; }
/* Cédulas ilustradas: cor da nota, moldura, padrão de linhas, valor e o animal */
.note {
  border: 0; border-radius: 12px; aspect-ratio: 2 / 1; max-width: 100%; color: #fff; padding: 0;
  position: relative; overflow: hidden; text-align: left;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 7px),
    radial-gradient(circle at 78% 50%, rgba(255,255,255,0.35) 0 28%, transparent 29%),
    linear-gradient(160deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 100%),
    var(--nc);
  box-shadow: 0 4px 0 rgba(31,43,82,0.3);
}
.note::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 8px; pointer-events: none; }
.note .v { position: absolute; left: 9px; top: 5px; font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
.note .rs { font-size: 0.7rem; margin-right: 1px; vertical-align: 0.45em; }
.note .a { position: absolute; left: 9px; bottom: 6px; max-width: 58%; white-space: nowrap; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.95; }
.note svg { position: absolute; right: 3px; top: 50%; width: 40%; height: 84%; transform: translateY(-50%); }
.note:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(31,43,82,0.3); }

/* Moedas desenhadas, com tamanhos diferentes como as de verdade */
.coin { border: 0; padding: 0; background: none; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.coin svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 0 rgba(20,26,50,0.35)); }
.coin:active svg { transform: translateY(3px); filter: drop-shadow(0 1px 0 rgba(20,26,50,0.35)); }
.coins { align-items: center; }
.coin[data-c="100"] { max-width: 66px; }
.coin[data-c="25"] { max-width: 62px; }
.coin[data-c="50"] { max-width: 59px; }
.coin[data-c="5"] { max-width: 57px; }
.coin[data-c="10"] { max-width: 53px; }

/* Na mão: mini nota ou moeda ao lado do valor */
.chip .mini { width: 26px; height: 16px; flex: none; }
.chip .mini.round { width: 18px; height: 18px; }

/* Níveis */
.levels { display: grid; gap: 12px; }
.level {
  border: 0; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); box-shadow: 0 5px 0 var(--line); width: 100%;
}
.level:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.level[data-lv="iniciante"] { background: #e6f8ec; box-shadow: 0 5px 0 #a9dfbb; }
.level[data-lv="intermediario"] { background: #fff0dc; box-shadow: 0 5px 0 #f3c98d; }
.level[data-lv="avancado"] { background: #ffe4ea; box-shadow: 0 5px 0 #f3a9b9; }
.level.locked { filter: grayscale(0.8); opacity: 0.6; }
.level .lv-emoji { font-size: 2.6rem; line-height: 1; flex: none; }
.level .lv-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.level strong { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; }
.level small { font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.level .lv-stars { font-size: 1.1rem; flex: none; }
.lv-stars .off, .unlock .off { filter: grayscale(1); opacity: 0.3; }
.unlock { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--accent-dark); }
.toggles { display: flex; gap: 8px; justify-content: center; }
.toggle { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--surface); font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.toggle[aria-pressed="false"] { opacity: 0.55; }

/* Decoração da lojinha */
.shop { --ch: 30px; }
.app.game .shop { --ch: 22px; }
.shop .wall { position: absolute; inset: 0; }
.shop .on-counter { position: absolute; bottom: calc(var(--ch) - 3px); width: 34px; height: 34px; z-index: 2; display: grid; place-items: center; font-size: 1.7rem; line-height: 1; }
.shop .on-counter svg { width: 100%; height: 100%; }
.shop .on-counter.toy { left: 42%; }
.shop .on-counter.uf { right: 52px; }
.app.game .shop .on-counter { width: 28px; height: 28px; font-size: 1.4rem; }
.item .sw svg { width: 60%; height: 80%; }
.item .tag { font-size: 0.68rem; font-weight: 800; color: var(--accent-dark); }
.shop .deco-top { position: absolute; left: 0; right: 0; top: 0; height: 18px; background-repeat: repeat-x; background-size: auto 100%; }
.shop .deco-emoji { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-size: 1rem; letter-spacing: 6px; white-space: nowrap; }
.app.game .shop .deco-emoji { left: 22%; }
.shop .pet { position: absolute; right: 10px; bottom: 18px; font-size: 2.2rem; line-height: 1; animation: petIdle 2.8s ease-in-out infinite; transform-origin: 50% 100%; z-index: 2; }
@keyframes petIdle { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.04, 0.96); } }
.shop.preview { height: 170px; border-radius: 22px; }
.shop.preview .counter { border-radius: 0 0 22px 22px; }
.shop.preview .mascot { position: absolute; left: 14px; bottom: 16px; width: 92px; height: 92px; z-index: 1; }
.shop.preview .say { width: calc(100% - 140px); }
.bank { font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.tab { border: 0; border-radius: 999px; padding: 7px 11px; font-size: 0.9rem; font-weight: 800; background: var(--surface); box-shadow: 0 3px 0 var(--line); white-space: nowrap; flex: none; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #0e1530; }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item {
  border: 0; border-radius: 16px; background: var(--surface); box-shadow: 0 4px 0 var(--line); padding: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center;
}
.item:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.item .sw { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; display: grid; place-items: center; font-size: 1.5rem; background: var(--bg); overflow: hidden; }
.item .nm { font-size: 0.8rem; font-weight: 800; line-height: 1.15; }
.item .pr { font-size: 0.8rem; font-weight: 800; }
.item.on { box-shadow: 0 0 0 3px var(--accent), 0 4px 0 var(--accent-dark); }
.item.poor .pr { color: var(--bad); }
.item.shake { animation: shake 0.35s; }
.earned { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; color: var(--warn); }

/* Menu para quem ainda não lê: ícone grande, cor forte, pouco texto */
.menu { display: grid; gap: 14px; }
.menu .btn { flex-direction: row; justify-content: flex-start; gap: 14px; padding: 14px 18px; text-align: left; }
.menu .btn .big { font-size: 2.6rem; line-height: 1; flex: none; }
.menu .btn .txt { display: flex; flex-direction: column; gap: 2px; }
.toggles .toggle { width: 54px; height: 54px; padding: 0; border-radius: 50%; font-size: 1.5rem; display: grid; place-items: center; }
.parents { border: 0; background: none; color: var(--muted); font-weight: 800; font-size: 0.85rem; padding: 10px; position: relative; overflow: hidden; border-radius: 999px; }
.parents .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(34,179,94,.25); }
.parents.holding .fill { width: 100%; transition: width 2s linear; }
.talk .bubble, .say { cursor: pointer; }
.hear { font-size: 0.8rem; opacity: 0.6; margin-left: 4px; }
.parent-card label.field { margin-top: 4px; }

.nickbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg); border-radius: 14px; padding: 8px 12px; }
.nickbar .nick-dice { width: 44px; height: 44px; font-size: 1.3rem; flex: none; }
.toplist small { color: var(--muted); font-weight: 700; }
.code { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; letter-spacing: .02em; background: var(--bg); border-radius: 12px; padding: 8px 12px; text-align: center; word-break: break-word; }
.parent-card input[type="text"] { font: inherit; padding: 12px; border-radius: 12px; border: 2px solid var(--line); width: 100%; }

/* Boas-vindas */
.uf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.uf-btn { border: 0; border-radius: 14px; background: var(--surface); box-shadow: 0 3px 0 var(--line); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.uf-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.uf-btn strong { font-family: var(--font-display); font-size: 1.3rem; line-height: 1; }
.uf-btn small { font-size: 0.68rem; color: var(--muted); font-weight: 700; line-height: 1.1; text-align: center; }
.nick-pick { text-align: center; justify-items: center; }
.nick-big { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.15; }
.nick-big.pop { animation: chipPop 0.35s; }
.big-dice { font-size: 1.6rem; }

.sp-chip { background: var(--sun); color: var(--ink); border-radius: 999px; padding: 1px 7px; font-size: 0.68rem; margin-left: 4px; letter-spacing: 0; text-transform: none; }
.tag-new { background: var(--pink); color: #fff; font-size: 0.72rem; font-weight: 800; border-radius: 999px; padding: 3px 8px; flex: none; }

.rank-line { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--accent-dark); margin: 0; min-height: 1.4em; }
.score-unit { font-size: 1.3rem; }
.unlock.center { text-align: center; }
.ach-new { background: #fff7d6; box-shadow: 0 4px 0 #f0d98a; }
.ach-new .unlock { margin: 0; }
.flash-count { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.flash-count b { display: inline-block; font-size: 1.4rem; color: var(--accent-dark); }
.flash-count b.bump { animation: sumBump .3s; }
#clock.hurry { background: var(--bad); color: #fff; animation: blink .5s infinite; }
.streak { background: #fff0e0; }

/* Álbum de conquistas */
.album { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ach { border: 0; border-radius: 18px; background: var(--surface); box-shadow: 0 4px 0 var(--line); padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.ach .ach-icon { font-size: 2.2rem; line-height: 1; filter: grayscale(1); opacity: .45; }
.ach.done .ach-icon { filter: none; opacity: 1; }
.ach.done { background: #fff7d6; box-shadow: 0 4px 0 #f0d98a; }
.ach-name { font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; line-height: 1.1; }
.ach-desc { font-size: 0.78rem; color: var(--muted); font-weight: 700; line-height: 1.2; }
.ach-ok { font-weight: 800; color: var(--accent-dark); font-size: 0.85rem; }
.bar { width: 100%; height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.flash-card { background: #efe6ff; box-shadow: 0 5px 0 #c9b3f5; }

/* Resultado */
.celebrate { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 4px 0 var(--line); }
.stars { font-size: 2.6rem; letter-spacing: 4px; line-height: 1; }
.stars .off { filter: grayscale(1); opacity: 0.3; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.stat { background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; font-weight: 800; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 4px 0 var(--line); }
.card.daily { background: #fff7d6; box-shadow: 0 4px 0 #f0d98a; }
.countdown { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
details.card summary { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; cursor: pointer; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 2px solid var(--bg); white-space: nowrap; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
td.ok { color: var(--good); font-weight: 800; }
td.meh { color: var(--warn); font-weight: 800; }
.note-box { font-size: 0.9rem; color: var(--muted); border-left: 4px solid var(--sun); padding-left: 10px; }
.share-text { width: 100%; font: inherit; font-size: 0.9rem; padding: 10px; border-radius: 14px; border: 0; background: var(--bg); color: var(--ink); resize: none; }
a { color: var(--accent-dark); }
tr.me td { font-weight: 800; color: var(--accent-dark); }
.toplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.toplist li { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 2px solid var(--bg); }
.toplist li.me { font-weight: 800; color: var(--accent-dark); }

/* Loja: parede, prateleira, cliente e balcão */
.shop {
  position: relative; height: 160px; border-radius: 22px 22px 0 0; overflow: hidden;
  background: linear-gradient(180deg, #fff1cf 0 62%, #f7dca0 62% 64%, #fff1cf 64%);
}
.shop .shelf { position: absolute; right: 62px; bottom: calc(var(--ch) + 34px); width: calc(100% - 210px); display: flex; justify-content: space-around; font-size: 1.4rem; }
.shop .counter { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #e98a5b; box-shadow: inset 0 5px 0 #f4a57c; }
.customer { z-index: 1; position: absolute; left: 14px; bottom: 18px; width: 118px; height: 138px; transform-origin: 50% 100%; }
.customer.enter { animation: walkIn 0.55s cubic-bezier(.2,.9,.3,1.25); }
.customer.leave { animation: walkOut 0.4s ease-in forwards; }
.customer.bump { animation: bump 0.5s; }
.customer.nope { animation: nope 0.5s; }
@keyframes walkIn { 0% { transform: translateX(-150%); } 60% { transform: translateX(6%) translateY(-6px); } 100% { transform: translateX(0); } }
@keyframes walkOut { 30% { transform: translateY(-10px); } 100% { transform: translateX(280%) translateY(-4px); } }
@keyframes bump { 0%,100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-12px) scale(1.06); } 60% { transform: translateY(0) scale(0.97); } }
@keyframes nope { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
.say { transform-origin: 0 40%; }
.say.pop { animation: pop 0.35s 0.3s both; }
@keyframes pop { from { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.05); } to { transform: scale(1); opacity: 1; } }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; left: 22%; top: 45%; width: 8px; height: 12px; border-radius: 2px; animation: conf 0.9s ease-out forwards; }
@keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
.say {
  z-index: 3; position: absolute; right: 12px; top: 12px; width: calc(100% - 160px); min-width: 0;
  background: var(--surface); border-radius: 16px; padding: 8px 12px; font-size: 0.95rem; line-height: 1.3;
  box-shadow: 0 3px 0 rgba(31,43,82,0.15);
}
.say::before { content: ""; position: absolute; left: -9px; top: 22px; border: 9px solid transparent; border-left: 0; border-right-color: var(--surface); }
.say .who { display: block; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; }
.say.bad { background: #ffe3e4; } .say.bad::before { border-right-color: #ffe3e4; }
.say.good { background: #dcf8e6; } .say.good::before { border-right-color: #dcf8e6; }

/* Caixa registradora */
.register {
  background: #33a39d; border-radius: 0 0 22px 22px; padding: 12px; display: grid; gap: 10px;
  box-shadow: 0 5px 0 #237a75; margin-top: -16px;
}
.lcd {
  background: #16392b; color: #7dffb2; border-radius: 12px; padding: 8px 14px;
  font-family: "VT323", ui-monospace, monospace; font-size: 1.55rem; line-height: 1.05;
  box-shadow: inset 0 3px 0 rgba(0,0,0,0.35); font-variant-numeric: tabular-nums;
}
.lcd .ln { display: flex; justify-content: space-between; gap: 10px; }
.lcd .ln.q { color: #ffe36e; }
.lcd .ln.q.bad { color: #ff8080; animation: blink 0.25s 3; }
.lcd .ln.q.ok { color: #7dffb2; }
.lcd.flick { animation: flick 0.4s; }
@keyframes flick { 0% { opacity: 0.1; } 25% { opacity: 1; } 45% { opacity: 0.3; } 100% { opacity: 1; } }
@keyframes blink { 50% { opacity: 0.2; } }
.register.shake { animation: shake 0.4s; }
.chip.pop { animation: chipPop 0.3s; }
@keyframes chipPop { from { transform: scale(0.3); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
.tray-sum.bump { animation: sumBump 0.25s; }
@keyframes sumBump { 50% { transform: scale(1.12); } }
.round-dots span { transition: background-color 0.4s; }
.register .tray { box-shadow: none; min-height: 96px; }
.keys { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.key { border: 0; border-radius: 14px; padding: 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.1; color: #fff; }
.key.clear { background: #ef6a5b; box-shadow: 0 5px 0 #b8453a; }
.key.give { background: var(--accent); box-shadow: 0 5px 0 var(--accent-dark); }
.key:active { transform: translateY(4px); box-shadow: none; }

/* Gaveta do caixa aberta */
.drawer.open {
  background: #55607e; border-radius: 18px; padding: 10px; gap: 10px;
  box-shadow: inset 0 8px 0 rgba(0,0,0,0.2), 0 4px 0 #3b4460;
}
.drawer.open .notes { background: rgba(0,0,0,0.18); border-radius: 12px; padding: 6px; }
.drawer.open .coins { background: rgba(0,0,0,0.18); border-radius: 12px; padding: 6px; }
.busy .drawer, .busy .keys, .busy .tray-items { pointer-events: none; }

/* Tela de jogo: tudo cabe na altura do celular, sem rolar.
   A loja encolhe ou cresce; caixa e gaveta têm altura fixa. */
.app.game { height: 100vh; height: 100dvh; padding-block: 8px; gap: 8px; }
.app.game header.top .brand { font-size: 1.2rem; }
.app.game .back { width: 40px; height: 40px; font-size: 1.15rem; }
.app.game .round-dots span { height: 8px; }
.app.game .shop { flex: 1 1 120px; min-height: 96px; max-height: 190px; height: auto; }
.app.game .customer { height: calc(100% - 14px); width: auto; aspect-ratio: 120 / 140; bottom: 10px; left: 10px; }
.app.game .say { top: 8px; padding: 6px 10px; font-size: 0.88rem; width: calc(100% - 44% - 20px); }
.app.game .shop .counter { height: 22px; }
.app.game .shop .shelf { font-size: 1.1rem; bottom: calc(var(--ch) + 28px); right: 54px; width: calc(56% - 64px); }
.app.game .shop .pet { font-size: 1.7rem; bottom: 12px; }
.app.game .register { padding: 8px; gap: 8px; margin-top: -14px; flex: none; }
.app.game .lcd { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; font-size: 1.3rem; padding: 6px 12px; }
.app.game .lcd .ln.q { grid-column: 1 / -1; }
.app.game .tray { min-height: 0; padding: 8px 10px; gap: 6px; }
.app.game .tray-sum { font-size: 1.35rem; }
.app.game .tray-items { min-height: 30px; }
.app.game .chip { padding: 4px 8px; font-size: 0.85rem; }
.app.game .flash { min-height: 0; font-size: 0.85rem; }
.app.game .flash:empty { display: none; }
.app.game .key { padding: 10px; font-size: 1.05rem; }
.app.game .drawer.open { padding: 7px; gap: 7px; flex: none; }
.app.game .notes { gap: 6px; padding: 5px; }
.app.game .note { aspect-ratio: 2.3 / 1; }
.app.game .note .v { font-size: 1.25rem; top: 4px; }
.app.game .note .a { bottom: 4px; }
.app.game .coins { gap: 6px; padding: 5px; }
.app.game .coin[data-c="100"] { max-width: 58px; }
.app.game .coin[data-c="25"] { max-width: 55px; }
.app.game .coin[data-c="50"] { max-width: 52px; }
.app.game .coin[data-c="5"] { max-width: 50px; }
.app.game .coin[data-c="10"] { max-width: 47px; }

@media (prefers-reduced-motion: reduce) {
  .customer.enter, .customer.bump, .customer.nope, .say.pop, .lcd.flick, .register.shake, .chip.pop, .tray-sum.bump { animation: none; }
  .customer.leave { animation: none; opacity: 0; }
  .confetti { display: none; }
  .tray.shake, .mascot.bob { animation: none; }
  .note:active, .coin:active, .btn:active { transform: none; }
}
</style>
</head>

      if (!confirmRestore) { confirmRestore = true; return bkMsg("Isso troca as moedinhas e a decoração deste celular pelas do código. Toque em Restaurar de novo para confirmar.", "bad"); }
      try { await backupRestore(code); renderParents("Pronto! Tudo restaurado."); }
      catch (e) { confirmRestore = false; bkMsg(e instanceof TypeError ? "Sem conexão com o servidor." : e.message, "bad"); }
    });
    document.getElementById("uf").addEventListener("change", (e) => {
      if (!e.target.value) return;
      store("tc-uf", e.target.value);
      renderParents(`Pronto! Estado: ${e.target.value}.`);
    });
  }

  // ---------- Minha lojinha ----------
  let shopTab = "parede";
  function renderShop(msg) {
    app.classList.remove("game");
    stopTick();
    const d = deco(), cat = DECOR[shopTab], money = bank();
    const list = cat.items;
    app.replaceChildren(el(`
      <header class="top">
        <span class="left"><button class="back" id="back" aria-label="Voltar ao início">←</button><span class="brand">🏪 Minha lojinha</span></span>
        <span class="pill bank" aria-label="Suas moedinhas">🪙 ${money}</span>
      </header>
      <section class="shop preview" id="shop">
        ${decorLayers(d)}
        ${mascot("happy", "mascot")}
        <p class="say pop" id="say">${msg || "Bem-vindo à sua lojinha! Escolha o que quer mudar 👇"}</p>
        <div class="counter" style="${counterStyle(d)}"></div>
      </section>
      <div class="tabs" role="tablist">${Object.entries(DECOR).map(([k, c]) => `
        <button class="tab" role="tab" data-tab="${k}" aria-selected="${k === shopTab}">${c.icon} ${c.label}</button>`).join("")}
      </div>

        const have = isOwned(it), on = d[shopTab] === it.id;
        const sw = shopTab === "parede" ? `<span class="sw" style="background:${it.css}"></span>`
          : shopTab === "balcao" ? `<span class="sw" style="background:${it.bg};box-shadow:inset 0 6px 0 ${it.top}"></span>`
          : it.css ? `<span class="sw" style="background:${it.css} repeat-x top / auto 40%, var(--bg)"></span>`
          : `<span class="sw">${it.text || "🚫"}</span>`;
        const tag = "";
        const pr = on ? "✔ Usando" : have ? "Usar" : `🪙 ${it.price}`;
        return `<button class="item${on ? " on" : ""}${!have && it.price > money ? " poor" : ""}" data-id="${it.id}">
          ${sw}${tag}<span class="nm">${it.name}</span><span class="pr">${pr}</span></button>`;
      }).join("")}</div>
      <p class="pause-note">Ganhe moedinhas atendendo clientes: troco perfeito vale mais!</p>
    `));
    document.getElementById("back").addEventListener("click", goBack);
    speak(msg || "Bem-vindo à sua lojinha! Escolha o que quer mudar.");
    app.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { sfx.tap(); shopTab = b.dataset.tab; renderShop(DECOR[shopTab].label + "!"); }));
    app.querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => chooseItem(b)));

  }
  function chooseItem(btn) {
    const it = findItem(shopTab, btn.dataset.id), d = deco();
    if (d[shopTab] === it.id) return;
    if (!isOwned(it)) {
      if (bank() < it.price) {
        sfx.bad();
        btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
        const say = document.getElementById("say");
        say.textContent = `Faltam ${it.price - bank()} moedinhas pra ${it.name}. Atenda mais uns clientes! 💪`;
        speak(say.textContent);
        return;
      }
      setBank(bank() - it.price);
      store("tc-owned", [...owned(), it.id]);
      store("tc-deco", { ...d, [shopTab]: it.id });
      bumpStats((st) => { st.bought++; });
      const fresh = checkAchievements();
      sfx.ok();
      if (fresh.length) setTimeout(sfx.achieve, 700);
      renderShop(`Oba! ${it.name} é seu! 🎉` + (fresh.length ? ` E você ganhou a conquista ${fresh[0].icon} ${fresh[0].name} (+${fresh[0].reward} 🪙)!` : ""));
      confetti(document.getElementById("shop"));
      return;
    }
    store("tc-deco", { ...d, [shopTab]: it.id });
    sfx.tap();
    renderShop(it.price === 0 && /nada|Nenhum|Vazia/.test(it.id + it.name) ? "Tirei. Quer colocar outro?" : `Ficou lindo com ${it.name}! ✨`);
  }

  // ---------- Níveis ----------
  const bestOf = (k) => Number(store("tc-level-" + k)) || 0;
  const isOpen = (k) => { const i = LEVEL_ORDER.indexOf(k); return i === 0 || bestOf(LEVEL_ORDER[i - 1]) > 0; };
  const starsHtml = (n) => `${"⭐".repeat(n)}<span class="off">${"⭐".repeat(3 - n)}</span>`;

  function renderLevels() {
    app.classList.remove("game");
    stopTick();
    app.replaceChildren(el(`
      <header class="top">

      }).join("")}
        <button class="level flash-card" data-flash="1">
          <span class="lv-emoji">⚡</span>
          <span class="lv-body"><strong>Relâmpago</strong><small>Quantos clientes você atende em 60 segundos?${Number(store("tc-flash-best")) ? ` Recorde: ${store("tc-flash-best")}` : ""}</small></span>
        </button>
      </div>
      ${togglesHtml()}
    `));
    bindToggles();
    document.querySelector("[data-flash]").addEventListener("click", () => { sfx.tap(); speak("Relâmpago! Atenda o máximo de clientes em 60 segundos. Valendo!"); startGame("relampago"); });
    document.getElementById("back").addEventListener("click", goBack);
    speak("Escolha um nível! O pintinho é o mais fácil, a raposa é médio e o leão é o mais difícil.");
    app.querySelectorAll(".level[data-lv]:not(.locked)").forEach((b) => b.addEventListener("click", () => { sfx.tap(); startGame(b.dataset.lv); }));
    app.querySelectorAll(".level.locked").forEach((b) => { b.disabled = false; b.addEventListener("click", () => { sfx.bad(); speak("Esse ainda está trancado. Termine o nível anterior pra abrir!"); }); });
  }

  // ---------- Navegação (botão voltar da tela e do Android) ----------
  // Cada tela aberta a partir do início ganha uma entrada no histórico;
  // voltar (pelo botão ou pelo Android) sempre leva ao início.
  let pushed = false;
  function enterScreen() {
    if (!pushed) { try { history.pushState({ tc: 1 }, ""); pushed = true; } catch (e) { /* sem histórico */ } }
  }
  function goBack() {
    if (pushed) history.back(); else toStart();
  }
  function toStart() {
    pushed = false;
    if (S) leaveGame(); else renderStart();
  }
  window.addEventListener("popstate", toStart);

  // ---------- Pausar e continuar o desafio do dia ----------
  function pauseKey(dif) { return `tc-pause-${todayKey()}-${dif}`; }
  function pausedGame(dif) {
    const p = store(pauseKey(dif));
    return p && p.day === todayKey() ? p : null;
  }
  function saveProgress() {
    if (!S || S.training) return;
    const t = now();
    store(pauseKey(S.dif), {
      day: S.day, attempt: S.attempt, i: S.busy ? S.i + 1 : S.i, results: S.results, wrong: S.wrong, roundWrong: S.roundWrong || 0,
      gameElapsed: t - S.gameStart, roundElapsed: S.busy ? 0 : t - S.roundStart,
    });
  }
  function clearProgress(dif) { try { localStorage.removeItem(pauseKey(dif)); } catch (e) { /* ok */ } }
  function leaveGame() {
    if (S && !S.busy) ping("pausa", S.i);
    saveProgress();
    app.classList.remove("busy");
    S = null;
    renderStart();
  }
  // Se o app for fechado no meio, o progresso fica salvo
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { saveProgress(); if (S && !S.busy) ping("pausa", S.i); }
    else if (S && !S.busy) ping("volta", S.i);
  });
  window.addEventListener("pagehide", saveProgress);

  // level: "iniciante" / "intermediario" / "avancado" / "relampago", ou null para o desafio do dia (com dif)
  function startGame(level, dif = "facil") {
    const flashMode = level === "relampago";
    const training = !!level;
    const seed = training ? `nivel-${level}-${Date.now()}` : dailySeed(todayKey(), dif);
    const tiers = flashMode ? LEVELS.intermediario.tiers : training ? LEVELS[level].tiers : DAILY[dif].tiers;
    S = {
      training, level, flash: flashMode, dif: training ? null : dif, seed, tiers,
      rounds: makeRounds(seed, tiers), i: 0, tray: {}, results: [], bonus: 0, bonusList: [],
      easy: level === "iniciante" || (!training && dif === "facil"),
      wrong: 0, roundStart: performance.now(), gameStart: performance.now(),
      uf: store("tc-uf") || null, day: todayKey(),
      attempt: training ? null : Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
    };
    if (!training) store("tc-lastdif", dif);
    const paused = training ? null : pausedGame(dif);
    if (paused) {
      const now = performance.now();
      Object.assign(S, {
        i: paused.i, results: paused.results, wrong: paused.wrong, roundWrong: paused.roundWrong, attempt: paused.attempt || S.attempt,
        bonus: paused.bonus || 0, bonusList: paused.bonusList || [],
        gameStart: now - paused.gameElapsed, roundStart: now - paused.roundElapsed,
      });
    }
    if (S.i >= S.rounds.length) return finish();
    renderRound();
    if (paused) ping("volta", S.i);
    startTick();
  }

  // ---------- Escolha da dificuldade do desafio do dia ----------
  function renderDailyPick() {
    app.classList.remove("game");
    stopTick();
    const firstEver = !store("tc-stats");
    const line = "Escolha o desafio de hoje! O pintinho é fácil, a raposa é médio e o leão é difícil. Cada um tem o seu ranking.";
    app.replaceChildren(el(`
      <header class="top">
        <span class="left"><button class="back" id="back" aria-label="Voltar ao início">←</button><span class="brand">📅 Desafio do dia</span></span>
        <span class="pill num">${ddmm(todayKey())}</span>
      </header>
      <div class="talk">${mascot("happy", "mascot bob")}<p class="bubble" data-speak="${line}">Escolha o desafio de hoje! Cada um tem o seu ranking. <span class="hear">🔈</span></p></div>
      <div class="levels">${DAILY_ORDER.map((d) => {
        const D = DAILY[d], best = dayRes(d), paused = pausedGame(d);
        const sub = paused ? `▶ continuar do cliente ${paused.i + 1}` : best ? `seu recorde hoje: ${fmtTime(best.score.total)}` : { facil: "preços redondos e dicas", medio: "centavos e notas até R$ 50", dificil: "valores até R$ 200" }[d];
        return `<button class="level" data-daily="${d}" data-lv="${{ facil: "iniciante", medio: "intermediario", dificil: "avancado" }[d]}">
          <span class="lv-emoji">${D.emoji}</span>
          <span class="lv-body"><strong>${D.name}</strong><small>${sub}</small></span>
          ${firstEver && d === "facil" ? `<span class="tag-new">comece aqui</span>` : best ? `<span class="lv-stars">${starsHtml(starsOf(best.results))}</span>` : ""}
        </button>`;
      }).join("")}</div>
    `));
    speak(line);
    document.getElementById("back").addEventListener("click", goBack);
    app.querySelectorAll("[data-daily]").forEach((b) => b.addEventListener("click", () => { sfx.tap(); startGame(null, b.dataset.daily); }));
  }

  function traySum() { return Object.entries(S.tray).reduce((a, [c, n]) => a + Number(c) * n, 0); }
  function trayCount() { return Object.values(S.tray).reduce((a, n) => a + n, 0); }

  function decorComment(c) {
    const d = deco(), opts = [];
    const pet = findItem("bichinho", d.bichinho), br = findItem("estado", d.estado), toy = findItem("antigo", d.antigo);
    if (pet.text) opts.push("Que bichinho fofo no balcão! 😍");
    if (br.text) opts.push(`Olha só: ${br.name.toLowerCase()}! Que demais! 😋`);
    if (toy.text) opts.push(c.group === "vovo" ? `Nossa, ${toy.name.toLowerCase()}! Eu brincava disso! 🥹` : `Que legal, ${toy.name.toLowerCase()}! 🤩`);
    if (d.parede !== "p-creme" || d.enfeite !== "e-nada") opts.push("Que loja bonita! ✨");
    if (!opts.length || Math.random() > 0.35) return "";
    return opts[Math.floor(Math.random() * opts.length)];
  }
  function askText(c, r) { return `Quero ${c.item}! Toma ${brl(r.paid)}.`; }
  // Falado: inclui o preço, que quem não lê só vê no visor
  function askSpeech(c, r) { return `Quero ${c.item}. Custa ${falaValor(r.price)}. Toma ${falaValor(r.paid)}.`; }

  function setCustomer(mood, text, kind = "", anim = "") {
    const c = makeCustomer(S.seed, S.i, S.rounds[S.i].price);
    document.getElementById("cust").innerHTML = customerSvg(c, mood, anim);
    const say = document.getElementById("say");
    say.className = "say " + kind;
    const who = S.flash ? `${c.name} · cliente ${S.i + 1}` : `${c.name} · cliente ${S.i + 1} de 5`;
    say.innerHTML = `<span class="who">${who}${c.special ? ` <span class="sp-chip">${SPECIALS[c.special].chip}</span>` : ""}</span>${text}`;
  }

  const retrigger = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

  // Monta a tela do caixa uma vez; depois só o cliente e o visor mudam
  function renderRound() {
    app.classList.add("game");
    app.replaceChildren(el(`
      <header class="top">
        <span class="left">
          <button class="back" id="back" aria-label="${S.training ? "Sair do nível" : "Pausar e voltar ao início"}">←</button>
          <span class="brand">${S.flash ? "⚡ Relâmpago" : S.training ? LEVELS[S.level].emoji + " " + LEVELS[S.level].name : DAILY[S.dif].emoji + " Desafio do dia"}</span>
        </span>
        <span class="left">
          <button class="back" id="sound" aria-label="Ligar ou desligar o som">${soundOn() ? "🔊" : "🔇"}</button>
          <span class="pill num" id="clock">0,0s</span>
        </span>
      </header>
      ${S.flash ? `<div class="flash-count" id="fcount">⚡ <b>0</b> clientes atendidos</div>`
        : `<div class="round-dots" id="dots">${S.rounds.map(() => "<span></span>").join("")}</div>`}
      <section class="shop" id="shop">
        ${decorLayers()}
        <div id="cust"></div>
        <p class="say" id="say" aria-live="polite"></p>
        <div class="counter" style="${counterStyle()}"></div>
      </section>
      <section class="register" id="register">
        <div class="lcd" id="lcd" aria-label="Visor do caixa">
          <div class="ln"><span>TOTAL</span><span id="lcdTotal"></span></div>
          <div class="ln"><span>PAGO</span><span id="lcdPaid"></span></div>
          <div class="ln q" id="lcdChangeLn"><span>TROCO</span><span id="lcdChange">?</span></div>
        </div>
        <div class="tray" id="tray">
          <div class="tray-head"><span class="eyebrow">Troco na mão</span><span class="tray-sum" id="sum">R$ 0,00</span></div>
          <div class="tray-items" id="items"></div>
          <div class="flash" id="flash" aria-live="polite"></div>
        </div>
        <div class="keys">
          <button class="key clear" id="clear">Limpar</button>
          <button class="key give" id="give">Entregar troco ✋</button>
        </div>
      </section>
      <section class="drawer open" aria-label="Gaveta do caixa">
        <div class="notes">${DENOMS.filter((d) => d.kind === "note").map((d) => `
          <button class="note" data-c="${d.c}" style="--nc:${d.color}" aria-label="Nota de ${brl(d.c)}">
            <span class="v"><span class="rs">R$</span>${d.c / 100}</span><span class="a">${d.animal}</span>${noteSvg(d.c)}
          </button>`).join("")}
        </div>
        <div class="coins">${DENOMS.filter((d) => d.kind === "coin").map((d) => `
          <button class="coin" data-c="${d.c}" aria-label="Moeda de ${brl(d.c)}">${coinSvg(d.c)}</button>`).join("")}
        </div>
      </section>
    `));
    app.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => addPiece(Number(b.dataset.c))));
    document.getElementById("clear").addEventListener("click", () => { if (S.busy) return; sfx.tap(); S.tray = {}; paintTray(); });
    document.getElementById("give").addEventListener("click", deliver);
    document.getElementById("back").addEventListener("click", goBack);
    document.getElementById("sound").addEventListener("click", (e) => {
      store("tc-sound", soundOn() ? "off" : "on");
      e.currentTarget.textContent = soundOn() ? "🔊" : "🔇";
      sfx.tap();
    });
    showCustomer();
    paintClock();
  }

  // Um cliente novo chega ao caixa
  function showCustomer() {
    ping("inicio", S.i);
    const r = S.rounds[S.i], c = makeCustomer(S.seed, S.i, S.rounds[S.i].price);
    document.querySelectorAll("#dots span").forEach((d, k) => { d.className = k < S.i ? "done" : k === S.i ? "now" : ""; });
    const fc = document.querySelector("#fcount b");
    if (fc) { fc.textContent = S.results.length; retrigger(fc, "bump"); }
    document.getElementById("shop").setAttribute("aria-label", `Cliente ${S.i + 1} de 5`);
    const intro = c.special ? SPECIALS[c.special].hello : decorComment(c);
    S.intro = intro;
    if (c.special) setTimeout(() => { if (S && S.rounds[S.i] === r) sfx.special(c.special); }, 250);
    setCustomer("normal", (intro ? intro + " " : "") + askText(c, r), "", "enter");
    const talk = (intro ? intro + " " : "") + askSpeech(c, r);
    document.getElementById("say").dataset.speak = talk;
    setTimeout(() => { if (S && S.rounds[S.i] === r) speak(talk); }, 500);
    retrigger(document.getElementById("say"), "pop");
    document.getElementById("lcdTotal").textContent = brl(r.price);
    document.getElementById("lcdPaid").textContent = brl(r.paid);
    document.getElementById("lcdChange").textContent = "?";
    document.getElementById("lcdChangeLn").className = "ln q";
    retrigger(document.getElementById("lcd"), "flick");
    S.tray = {}; S.lastAdded = null;
    paintTray(); flash("", "");
  }

  function addPiece(c) { if (S.busy) return; sfx.piece(c); S.tray[c] = (S.tray[c] || 0) + 1; S.lastAdded = c; paintTray(); }
  function removePiece(c) { if (S.busy) return; sfx.tap(); S.lastAdded = null; S.tray[c]--; if (S.tray[c] <= 0) delete S.tray[c]; paintTray(); }

  function paintTray() {
    const sumEl = document.getElementById("sum");
    sumEl.textContent = brl(traySum());
    if (S.lastAdded) retrigger(sumEl, "bump");
    const items = document.getElementById("items");
    const entries = Object.entries(S.tray).sort((a, b) => b[0] - a[0]);
    if (!entries.length) { items.innerHTML = `<span class="empty">Toque nas notas e moedas 👇</span>`; return; }
    items.replaceChildren(...entries.map(([c, n]) => {
      const b = document.createElement("button");
      b.className = "chip" + (Number(c) === S.lastAdded ? " pop" : "");
      b.setAttribute("aria-label", `Tirar uma de ${brl(Number(c))}`);
      b.innerHTML = `${miniSvg(Number(c))}${n > 1 ? n + "× " : ""}${brl(Number(c))} <span class="x">×</span>`;
      b.addEventListener("click", () => removePiece(Number(c)));
      return b;
    }));
  }

  function flash(msg, kind) {
    const f = document.getElementById("flash");
    f.textContent = msg; f.className = "flash " + kind;
  }

  const now = () => (S && S.pausedAt) || performance.now();

  function deliver() {
    if (S.busy) return;
    const r = S.rounds[S.i];
    const sum = traySum();
    const lcdLn = document.getElementById("lcdChangeLn"), lcdVal = document.getElementById("lcdChange");
    if (sum !== r.change) {
      S.wrong++;
      S.roundWrong = (S.roundWrong || 0) + 1;
      sfx.bad(); buzz(200);
      retrigger(document.getElementById("register"), "shake");
      lcdVal.textContent = "ERRO!";
      lcdLn.className = "ln q"; retrigger(lcdLn, "bad");
      flash(S.easy ? `Dica: o troco é ${brl(r.change)} 😉` : S.flash ? "Tente de novo! (-3s)" : "Tente de novo! (+5s)", "bad");
      const sadLine = sum > r.change ? "Hmm... você me deu troco a mais! 🤔" : "Hmm... acho que faltou troco! 🤔";
      setCustomer("sad", sadLine, "bad", "nope");
      speak(S.easy ? `${sadLine} Dica: o troco é ${falaValor(r.change)}.` : sadLine);
      const cur = S, round = S.i, token = (S.token = (S.token || 0) + 1);
      setTimeout(() => {
        if (S !== cur || S.i !== round || S.token !== token || S.busy) return;
        setCustomer("normal", askText(makeCustomer(S.seed, S.i, r.price), r));
        lcdVal.textContent = "?"; lcdLn.className = "ln q";
      }, 1600);
      return;
    }
    const t = performance.now();
    const pieces = trayCount(), best = minPieces(r.change);
    S.results.push({ ...r, ms: t - S.roundStart, pieces, best, wrong: S.roundWrong || 0, tray: { ...S.tray } });
    ping("fim", S.i);
    S.roundWrong = 0;
    // O relógio para enquanto o cliente comemora e vai embora (no relâmpago não para, e a troca é mais rápida)
    S.busy = true; S.pausedAt = S.flash ? null : t;
    const fast = S.flash;
    app.classList.add("busy");
    sfx.ok(); buzz(40);
    lcdVal.textContent = brl(r.change) + " ✓";
    lcdLn.className = "ln q ok";
    flash("", "");
    const cust = makeCustomer(S.seed, S.i, r.price), last = S.results[S.results.length - 1];
    const sp = cust.special && SPECIALS[cust.special];
    const extraCoins = sp ? sp.bonus(last, last.ms) : 0;
    if (extraCoins) { S.bonus += extraCoins; S.bonusList.push(`${sp.chip.split(" ")[0]} +${extraCoins}`); }
    trackServe(last, cust, extraCoins);
    const thanks = sp ? sp.thanks : "Valeu! Troco certinho! 😄";
    setCustomer("happy", thanks + (extraCoins ? ` (+${extraCoins} 🪙)` : ""), "good", "bump");
    speak(extraCoins ? `${thanks} Mais ${extraCoins} moedinhas!` : sp ? thanks : "Valeu!");
    confetti(document.getElementById("shop"));
    if (cust.special === "aniversario") setTimeout(() => confetti(document.getElementById("shop")), 250);
    const cur = S;
    setTimeout(() => { if (S === cur) document.querySelector(".customer").classList.add("leave"); }, fast ? 350 : 800);
    setTimeout(() => {
      if (S !== cur) return;
      app.classList.remove("busy");
      const resume = performance.now();
      if (S.pausedAt) S.gameStart += resume - S.pausedAt;
      S.pausedAt = null; S.busy = false;
      if (S.flash && S.i + 1 >= S.rounds.length) S.rounds.push(...makeRounds(`${S.seed}-${S.rounds.length}`, S.tiers));
      S.i++; S.roundStart = resume;
      if (S.flash && flashLeft() <= 0) return finish();
      if (S.i >= S.rounds.length) return finish();
      saveProgress();
      sfx.door();
      showCustomer();
    }, fast ? 650 : 1200);
  }

  function finish() {
    stopTick();
    const res = { day: S.day, dif: S.dif, uf: S.uf, training: S.training, level: S.level, attempt: S.attempt, results: S.results, score: scoreOf(S.results), bonus: S.bonus, bonusList: S.bonusList };
    if (!S.training) {
      // Pode jogar de novo: no ranking vale o melhor tempo do dia (em cada dificuldade)
      const prev = dayRes(S.dif, S.day);
      res.firstToday = !prev;
      res.isBest = !prev || res.score.total < prev.score.total;
      res.prevBest = prev ? prev.score.total : null;
      if (res.isBest) store(dayKeyOf(S.day, S.dif), res);
      else {
        // Não bateu o recorde: esta partida não vai para o ranking. Se o recorde
        // ainda não chegou ao servidor (estava sem internet), envia o recorde.
        res.sent = true;
        if (!prev.sent) setTimeout(() => syncRanking({ ...prev, isBest: true }), 300);
      }
      clearProgress(S.dif);
    }
    if (!S.training) {
      const streak = advanceStreak();
      if (streak) { res.streak = streak; res.streakBonus = Math.min(streak, 7) * 2; }
    }
    if (S.flash) {
      res.flash = true;
      const prevFlash = Number(store("tc-flash-best")) || 0;
      res.flashCount = S.results.length;
      res.isBest = res.flashCount > prevFlash;
      res.prevBest = prevFlash;
      if (res.isBest) store("tc-flash-best", res.flashCount);
      bumpStats((st) => { st.flashBest = Math.max(st.flashBest, res.flashCount); });
    }
    bumpStats((st) => { st.games++; });
    if (S.level && !S.flash) {
      const next = LEVEL_ORDER[LEVEL_ORDER.indexOf(S.level) + 1];
      const wasOpen = next ? isOpen(next) : true;
      store("tc-level-" + S.level, Math.max(bestOf(S.level), starsOf(S.results)));
      if (next && !wasOpen && isOpen(next)) res.unlocked = next;
    }
    res.coins = coinsFor(res);
    setBank(bank() + res.coins);
    res.achievements = checkAchievements();
    setTimeout(() => backupSave(true), 1500);
    S = null;
    sfx.win();
    // Depois da fanfarra: fogo da sequência e brilho das conquistas
    let later = 1500;
    if (res.streak) { setTimeout(sfx.streak, later); later += 1200; }
    if (res.achievements.length) setTimeout(sfx.achieve, later);
    renderResult(res);
  }

  function squares(results) { return results.map((r) => (r.wrong === 0 && r.pieces === r.best) ? "🟩" : "🟨").join(""); }

  function shareText(res) {
    return `Troco Certo ${ddmm(res.day)} ${DAILY[res.dif || "dificil"].emoji}${res.uf ? ` (${res.uf})` : ""}\n${squares(res.results)}\n⏱️ ${fmtTime(res.score.total)}\nVocê é bom de troco?`;
  }

  function nextLevel(res) {
    if (!res.level || res.flash) return null;
    const next = LEVEL_ORDER[LEVEL_ORDER.indexOf(res.level) + 1];
    return next && isOpen(next) ? next : null;
  }

  function renderResult(res) {
    app.classList.remove("game");
    const sc = res.score;
    const perfect = res.results.filter(isPerfect).length;
    const stars = starsFor(res);
    const fresh = !res.fromMenu;
    const cheer = res.flash
      ? (stars === 3 ? "Que rapidez!" : stars === 2 ? "Mandou bem!" : "Boa! Tente de novo!")
      : stars === 3 ? "Incrível! Troco perfeito!" : stars === 2 ? "Mandou bem!" : "Boa! Treine e fique ainda melhor!";
    const rows = res.results.map((r, k) => {
      const ok = isPerfect(r);

    }).join("");
    const daily = !res.training;
    const text = daily ? shareText(res) : "";
    const pill = res.flash ? "⚡ Relâmpago" : res.level ? LEVELS[res.level].emoji + " " + LEVELS[res.level].name : DAILY[res.dif || "dificil"].emoji + " " + ddmm(res.day);
    const chips = [];
    if (res.flash) chips.push(`<span class="stat">✅ ${perfect} perfeitos</span>`);
    else chips.push(`<span class="stat">✅ ${perfect} de ${res.results.length} perfeitos</span>`);
    if (res.coins && fresh) chips.push(`<span class="stat earned-stat">🪙 +${res.coins} moedinhas</span>`);
    if (fresh && res.bonusList && res.bonusList.length) chips.push(`<span class="stat earned-stat">✨ clientes especiais: ${res.bonusList.join(" ")}</span>`);
    if (fresh && res.streak) chips.push(`<span class="stat earned-stat">🔥 ${res.streak} ${res.streak === 1 ? "dia" : "dias seguidos"}! +${res.streakBonus}</span>`);
    if (fresh && res.isBest && res.prevBest) chips.push(`<span class="stat earned-stat">🏅 Novo recorde!</span>`);
    if (fresh && !res.isBest && res.prevBest && (daily || res.flash)) chips.push(`<span class="stat">🏅 Seu recorde: ${res.flash ? res.prevBest + " clientes" : fmtTime(res.prevBest)}</span>`);
    if (!res.flash && sc.wrong) chips.push(`<span class="stat">❌ ${sc.wrong} ${sc.wrong === 1 ? "erro" : "erros"}</span>`);
    const achHtml = fresh && res.achievements && res.achievements.length

    app.replaceChildren(el(`
      <header class="top">
        <span class="left"><button class="back" id="back" aria-label="Voltar ao início">←</button>${brandHtml()}</span>
        <span class="pill num">${pill}</span>
      </header>
      <section class="celebrate">
        ${mascot(stars === 3 ? "wow" : "happy", "mascot bob")}
        <h1>${cheer}</h1>
        <div class="stars" aria-label="${stars} de 3 estrelas">${"⭐".repeat(stars)}<span class="off">${"⭐".repeat(3 - stars)}</span></div>
        <div class="score">${res.flash ? `⚡ ${res.results.length} <small class="score-unit">clientes</small>` : fmtTime(sc.total)}</div>
        ${daily ? `<p class="rank-line" id="rankLine">🏆 Buscando sua posição…</p>` : ""}
        <div class="stats">${chips.join("")}</div>
      </section>
      ${achHtml}
      ${res.unlocked ? `<p class="unlock center">🔓 Você liberou o nível ${LEVELS[res.unlocked].emoji} ${LEVELS[res.unlocked].name}!</p>` : ""}
      ${nextLevel(res) ? `<button class="btn" id="nextLv">▶ Próximo: ${LEVELS[nextLevel(res)].emoji} ${LEVELS[nextLevel(res)].name}</button>` : ""}
      <div class="row">
        <button class="btn sun" id="again">🔁 De novo</button>
        <button class="btn ghost" id="home">🏠 Início</button>
      </div>
      <button class="btn ghost" id="shopBtn">🏪 Gastar na lojinha<small>você tem 🪙 ${bank()} moedinhas</small></button>
      ${daily ? `
      <section class="card" id="rank" aria-live="polite">
        <h2>🏆 Ranking de hoje ${DAILY[res.dif || "dificil"].emoji}</h2>
        <p class="muted">Buscando o ranking…</p>
      </section>

        <summary>📣 Mostre pros amigos</summary>

        <p class="flash good" id="copied" aria-live="polite"></p>

      <details class="card">
        <summary>📅 Como funciona o desafio</summary>
        <p>Todo mundo do Brasil recebe os <strong>mesmos 5 clientes</strong> no dia, em cada dificuldade. Jogue quantas vezes quiser: no ranking fica o <strong>seu melhor tempo</strong>.</p>
        <p>Um desafio novo chega em: <strong class="countdown" id="next">--:--:--</strong></p>
      </details>` : res.level && !res.flash ? `
      <details class="card">
        <summary>${LEVELS[res.level].emoji} Seu recorde no nível: ${starsHtml(bestOf(res.level))}</summary>

      </details>` : ""}
      <details class="card">
        <summary>🧾 Ver cliente por cliente</summary>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Compra</th><th>Pagou</th><th>Troco</th><th>Peças</th><th>Tempo</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="muted">Nenhum cliente atendido.</td></tr>`}</tbody>
        </table></div>
        <p class="muted" style="font-size:.85rem">Peças: quantas você usou / o mínimo possível.</p>
      </details>
    `));
    const on = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener("click", fn); };
    on("nextLv", () => startGame(nextLevel(res)));
    on("again", () => startGame(res.flash ? "relampago" : res.level || null, res.dif || "dificil"));
    on("shopBtn", () => { enterScreen(); renderShop(); });
    document.getElementById("home").addEventListener("click", goBack);
    document.getElementById("back").addEventListener("click", goBack);
    const copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", () => {
      const done = () => { document.getElementById("copied").textContent = "Resultado copiado. Cole no grupo!"; };
      const fallback = () => { const t = document.getElementById("sharetxt"); t.focus(); t.select(); document.getElementById("copied").textContent = "Texto selecionado. Copie e cole no grupo."; };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
    if (daily) { startCountdown(res); syncRanking(res); }
    if (fresh && !res.spoken) {
      res.spoken = true;
      const parts = [cheer];
      if (res.flash) parts.push(`Você atendeu ${res.results.length} clientes!`);
      if (res.isBest && res.prevBest) parts.push("Novo recorde!");
      if (res.streak > 1) parts.push(`${res.streak} dias seguidos!`);
      if (res.coins) parts.push(`Você ganhou ${res.coins} moedinhas!`);
      if (res.achievements && res.achievements.length) parts.push(`E ganhou a conquista ${res.achievements[0].name}!`);

  // ---------- Ranking (servidor) ----------
  function playerId() {
    let id = store("tc-player");
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12));
      store("tc-player", id);
    }
    return id;
  }

  async function api(path, opts) {
    const r = await fetch((window.TROCO_API || "") + path, { headers: { "Content-Type": "application/json" }, ...opts });
    const data = await r.json().catch(() => ({}));
    return { status: r.status, data };
  }

  // Apelido sorteado das listas fixas (o servidor só aceita combinações delas)
  const { nickName, randomNick, validNick } = window.Regras;
  function myNick() {
    let n = store("tc-nick");
    if (!validNick(n)) { n = randomNick(); store("tc-nick", n); }
    return n;
  }
  async function rerollNick(day) {
    const n = randomNick();
    store("tc-nick", n);
    sfx.tap();
    speak(`Agora você é ${nickName(n)}!`);
    if (day) { try { await api("api/apelido", { method: "POST", body: JSON.stringify({ day, playerId: playerId(), nick: n }) }); } catch (e) { /* sem internet */ } }
    backupSave(true);
    return n;
  }

  // Avisos de tempo para o servidor (só no desafio do dia). Sem internet, o jogo segue normal.
  function ping(tipo, round) {
    if (!S || S.training) return;
    const url = (window.TROCO_API || "") + "api/evento";
    const body = JSON.stringify({ day: S.day, playerId: playerId(), round, tipo, tentativa: S.attempt });
    try {
      if (tipo === "pausa" && navigator.sendBeacon) { navigator.sendBeacon(url, new Blob([body], { type: "text/plain" })); return; }
      fetch(url, { method: "POST", body, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(() => {});
    } catch (e) { /* ok */ }
  }

  // Play Integrity: só no app Android publicado; nos outros casos segue sem
  function getIntegrity() {
    return new Promise(async (resolve) => {
      if (!window.AndroidIntegridade) return resolve(null);
      try {
        const { status, data } = await api("api/nonce", { method: "POST", body: JSON.stringify({ playerId: playerId() }) });
        if (status !== 200) return resolve(null);
        const t = setTimeout(() => resolve(null), 8000);
        window.__integridade = (ok, token) => { clearTimeout(t); resolve(ok ? { nonce: data.nonce, token } : null); };
        window.AndroidIntegridade.pedir(data.nonce);
      } catch (e) { resolve(null); }
    });
  }

  // Código de recuperação (moedinhas, decoração, níveis e apelido)
  function backupData() {
    const levels = {};
    for (const k of LEVEL_ORDER) levels[k] = bestOf(k);
    return { bank: bank(), owned: [...owned()], deco: deco(), levels, playerId: playerId(), nick: myNick(), uf: store("tc-uf") || null };
  }
  async function backupSave(silent) {
    const b = store("tc-backup");
    if (silent && !(b && b.secret)) return null;
    try {
      const body = b && b.secret ? { code: b.code, secret: b.secret, data: backupData() } : { data: backupData() };
      const { status, data } = await api("api/backup", { method: "POST", body: JSON.stringify(body) });
      if (status === 200 || status === 201) { store("tc-backup", { code: data.code, secret: data.secret, at: Date.now() }); return data.code; }
      if (status === 403 && !silent) { store("tc-backup", null); return backupSave(false); }
    } catch (e) { /* sem internet */ }
    return null;
  }
  async function backupRestore(code) {
    const { status, data } = await api("api/backup/" + encodeURIComponent(code.trim().toLowerCase()));
    if (status !== 200) throw new Error(data.error || "Não deu certo. Confira o código.");
    const d = data.data;
    store("tc-bank", d.bank); store("tc-owned", d.owned); store("tc-deco", d.deco);
    for (const [k, v] of Object.entries(d.levels || {})) store("tc-level-" + k, v);
    if (d.playerId) store("tc-player", d.playerId);
    if (d.nick) store("tc-nick", d.nick);
    if (d.uf) store("tc-uf", d.uf);
    store("tc-backup", { code: code.trim().toLowerCase(), secret: null, at: Date.now() });
  }

  async function syncRanking(res) {
    const box = document.getElementById("rank");
    res.uf = res.uf || store("tc-uf");
    if (!res.uf) {
      const line = document.getElementById("rankLine");
      if (line) line.textContent = "";
      if (box) box.innerHTML = `<h2>🏆 Ranking de hoje</h2><p class="note-box">Peça pra um adulto escolher o seu estado na <strong>Área dos pais</strong> 👨‍👩‍👧 pra entrar no ranking.</p>`;
      return;
    }
    try {
      let ranking;
      if (!res.sent) {
        const body = { day: res.day, dif: res.dif || "dificil", uf: res.uf, playerId: playerId(), nick: myNick(), tentativa: res.attempt, rounds: res.results.map((r) => ({ pieces: r.tray || {}, ms: r.ms, wrong: r.wrong })) };
        const integrity = await getIntegrity();
        if (integrity) body.integrity = integrity;
        const { status, data } = await api("api/resultado", { method: "POST", body: JSON.stringify(body) });
        if (status === 201 || status === 200 || status === 409) { res.sent = true; if (res.isBest) store(dayKeyOf(res.day, res.dif || "dificil"), res); ranking = data.ranking; }
        else if (status === 400 || status === 403) { res.sent = true; if (res.isBest) store(dayKeyOf(res.day, res.dif || "dificil"), res); throw new Error(data.error || "Resultado recusado."); }
        else throw new Error("offline");
      }
      if (!ranking) {
        const q = new URLSearchParams({ day: res.day, uf: res.uf, dif: res.dif || "dificil", playerId: playerId() });
        const { status, data } = await api("api/ranking?" + q);
        if (status !== 200) throw new Error("offline");
        ranking = data;
      }
      if (document.body.contains(box)) paintRanking(box, ranking, res.uf, res);
    } catch (e) {
      if (!document.body.contains(box)) return;
      const line = document.getElementById("rankLine");
      if (line) line.textContent = "";
      const msg = e.message && e.message !== "offline" && !(e instanceof TypeError)
        ? "Seu resultado não entrou no ranking. Motivo: " + e.message
        : "Sem conexão com o servidor do ranking. Seu resultado fica guardado aqui e é enviado na próxima vez que você abrir o jogo com internet.";
      box.innerHTML = `<h2>🏆 Ranking de hoje</h2><p class="note-box">${msg}</p>`;
    }
  }

  function paintRanking(box, r, uf, res) {
    const ord = (n) => n + "º";
    const line = document.getElementById("rankLine");
    if (line && r.voce) {
      const pos = r.voce.posicaoBrasil;
      line.innerHTML = `${["🥇", "🥈", "🥉"][pos - 1] || "🏆"} Você está em <strong>${ord(pos)} lugar</strong> no Brasil!`;
      if (res && !res.fromMenu && !res.rankSpoken) { res.rankSpoken = true; setTimeout(() => speak(`Você está em ${pos}º lugar no Brasil!`), 4200); }
    } else if (line) line.textContent = "";
    const medal = (n) => ["🥇", "🥈", "🥉"][n - 1] || ord(n);
    const you = r.voce
      ? `<p><strong>Você:</strong> ${r.voce.posicaoUf ? ord(r.voce.posicaoUf) + " de " + r.totalUf + " em " + uf + " · " : ""}${ord(r.voce.posicaoBrasil)} de ${r.totalBrasil} no Brasil</p>`
      : `<p class="muted">${r.totalBrasil} pessoa(s) jogaram hoje.</p>`;
    const nickBar = `<p class="nickbar"><span>Seu apelido: <strong id="nickName">${nickName(myNick())}</strong></span>
      <button class="toggle nick-dice" id="nickDice" aria-label="Sortear outro apelido">🎲</button></p>`;
    const mine = r.estados.find((e) => e.uf === uf);
    const top = r.estados.slice(0, 10);
    if (mine && !top.includes(mine)) top.push(mine);
    const rows = top.map((e) => `<tr${e.uf === uf ? ' class="me"' : ""}>
        <td>${e.posicao ? ord(e.posicao) : "—"}</td><td>${e.uf}</td><td>${e.jogadores}</td><td>${fmtTime(e.media)}</td></tr>`).join("");
    const list = (arr, showUf) => arr.map((p) => `<li${p.voce ? ' class="me"' : ""}><span>${medal(p.posicao)} ${p.apelido}${showUf ? ` <small>(${p.uf})</small>` : ""}</span><span>${fmtTime(p.score)}</span></li>`).join("");
    box.innerHTML = `
      <h2>🏆 Ranking de hoje</h2>
      ${you}
      ${nickBar}
      ${r.topBrasil && r.topBrasil.length ? `<p class="eyebrow">Top 10 do Brasil</p><ol class="toplist">${list(r.topBrasil, true)}</ol>` : ""}
      ${r.topUf.length ? `<p class="eyebrow">Top 10 de ${uf}</p><ol class="toplist">${list(r.topUf, false)}</ol>` : ""}
      <details>
        <summary class="eyebrow">Placar dos estados</summary>
        <div class="table-wrap"><table>
          <thead><tr><th>Pos.</th><th>UF</th><th>Jogadores</th><th>Média</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="muted">Ninguém jogou ainda.</td></tr>`}</tbody>
        </table></div>
        <p class="muted" style="font-size:.85rem">Um estado entra no placar com pelo menos ${r.minJogadoresEstado} jogadores.</p>
      </details>`;
    document.getElementById("nickDice").addEventListener("click", async () => {
      await rerollNick(r.day);
      if (res) syncRanking(res); else document.getElementById("nickName").textContent = nickName(myNick());
    });
  }

  function startCountdown(res) {
    const n = document.getElementById("next");
    const paint = () => {
      if (!document.body.contains(n)) return stopTick();
      let s = Math.floor(msToNextDay() / 1000);
      if (res.day !== todayKey()) return boot();
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); s %= 60;
      n.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    };
    stopTick(); paint(); tick = setInterval(paint, 1000);
  }

  // ---------- Relógio ----------
  const FLASH_MS = 60000, FLASH_PENALTY = 3000;
  const flashLeft = () => FLASH_MS - (now() - S.gameStart) - S.wrong * FLASH_PENALTY;
  function paintClock() {
    const c = document.getElementById("clock");
    if (!c || !S) return;
    if (S.flash) {
      const left = flashLeft();
      const sec = Math.max(0, Math.ceil(left / 1000));
      c.textContent = "⚡ " + sec + "s";
      c.classList.toggle("hurry", left < 10000);
      // Últimos 10 segundos: música mais rápida e tique-taque (mais forte nos 3 finais)
      setMusicRate(left < 10000 ? 1.15 : 1);
      if (left < 10000 && sec > 0 && sec !== S.lastTick) { S.lastTick = sec; sfx.tick(sec <= 3); }
      if (left <= 0 && !S.busy) finish();
      return;
    }
    // No fácil o relógio não aparece (o tempo continua contando para o ranking)
    if (S.easy) { c.textContent = "🐣"; return; }
    const penalty = S.wrong * WRONG_PENALTY;
    c.textContent = secs(now() - S.gameStart + penalty);
  }
  function startTick() { stopTick(); tick = setInterval(paintClock, 100); }
  function stopTick() { if (tick) clearInterval(tick); tick = null; }

  // Itens comprados na versão que separava o Brasil por estado ganham os códigos novos
  function migrateItems() {
    const map = window.Regional.ANTIGOS, own = store("tc-owned") || [], d = store("tc-deco") || {};
    if (!own.some((id) => map[id]) && !map[d.estado]) return;
    store("tc-owned", [...new Set(own.map((id) => map[id] || id))]);
    if (map[d.estado]) store("tc-deco", { ...d, estado: map[d.estado] });
  }

  function boot() {
    migrateItems();
    if (!Object.keys(buffers).length) loadSounds();
    renderStart();
    // Recordes de hoje que ainda não chegaram ao servidor: tenta enviar em segundo plano
    for (const r of anyDayRes()) if (!r.sent) syncRanking({ ...r, dif: r.dif || "dificil" });
  }
  boot();
})();
</script>

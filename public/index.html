<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Troco Certo</title>
<style>
/* Fontes dentro do app (funcionam sem internet). Licença SIL OFL em fonts/. */
@font-face { font-family: "Baloo 2"; font-weight: 600; font-display: swap; src: url("fonts/baloo-2-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 600; font-display: swap; src: url("fonts/nunito-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 700; font-display: swap; src: url("fonts/nunito-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 800; font-display: swap; src: url("fonts/nunito-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "VT323"; font-weight: 400; font-display: swap; src: url("fonts/vt323-latin-400-normal.woff2") format("woff2"); }
/* Layout: uma tela de app estreita (max 440px), clara e colorida para crianças.
   Tema único de propósito (céu claro), igual no modo escuro do celular. */
:root {
  color-scheme: light;
  --bg: #dff2ff;          /* céu */
  --bg-deep: #c3e6ff;
  --surface: #ffffff;
  --ink: #1f2b52;         /* azul-marinho, mais suave que preto */
  --muted: #5a6690;
  --line: #cfdcf0;
  --accent: #22b35e;      /* verde "vai!" */
  --accent-dark: #178a47;
  --accent-ink: #ffffff;
  --sun: #ffc93c;         /* amarelo do treino e das estrelas */
  --sun-dark: #d99a00;
  --pink: #ff6b9a;
  --good: #16924b;
  --warn: #c77700;
  --bad: #e5484d;
  --receipt: #fffdf3;
  --font-display: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* cores das cédulas do Real */
  --n2: #5f7f9c; --n5: #7a5a9a; --n10: #d0453d; --n20: #e79a1f; --n50: #b0773a; --n100: #2f74c0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg) linear-gradient(180deg, var(--bg-deep) 0, var(--bg) 220px) no-repeat;
  color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45; font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 440px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 36px; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; font-weight: 800; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.4rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 800; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
header.top .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; gap: 6px; }
header.top .brand svg { width: 30px; height: 30px; flex: none; }
.back { border: 0; background: var(--surface); border-radius: 999px; width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.3rem; font-weight: 800; line-height: 1; flex: none; box-shadow: 0 3px 0 var(--line); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 0.9rem; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.pause-note { font-size: 0.95rem; color: var(--muted); text-align: center; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
/* Botões "fofinhos": sombra sólida embaixo que afunda ao tocar */
.btn {
  border: 0; border-radius: 18px; padding: 14px 18px; width: 100%;
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; line-height: 1.1;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 5px 0 var(--accent-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; text-decoration: none;
}
.btn small { font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; opacity: 0.9; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
.btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 var(--sun-dark); }
.btn.sun:active { box-shadow: 0 1px 0 var(--sun-dark); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.small { padding: 10px 14px; font-size: 1.05rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

/* Mascote */
.mascot { width: 96px; height: 96px; flex: none; }
.mascot.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
.talk { display: flex; align-items: center; gap: 12px; }
.bubble { background: var(--surface); border-radius: 18px; padding: 12px 14px; position: relative; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right-color: var(--surface); }

/* Início */
.hero { display: flex; flex-direction: column; gap: 12px; padding-block: 4px; }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0; margin: 0; list-style: none; }
.how li { background: var(--surface); border-radius: 16px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 0.85rem; line-height: 1.25; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.how .ico { font-size: 1.8rem; line-height: 1; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 0.95rem; }
select { font: inherit; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 0; background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line); }

/* Cupom */
.receipt {
  background: var(--receipt); border-radius: 14px 14px 4px 4px;
  padding: 14px 16px; display: grid; gap: 4px; position: relative;
  font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 var(--line);
}
.receipt::after { /* serrilhado do cupom */
  content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 8px;
  background: radial-gradient(circle at 6px -2px, transparent 6px, var(--receipt) 6.5px) 0 0 / 12px 8px repeat-x;
}
.receipt .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.receipt .big { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
.receipt .dash { border-top: 2px dashed var(--line); margin-block: 6px; }
.round-dots { display: flex; gap: 6px; }
.round-dots span { flex: 1; height: 10px; border-radius: 5px; background: var(--surface); }
.round-dots span.done { background: var(--accent); }
.round-dots span.now { background: var(--sun); }

/* Bandeja */
.tray { background: var(--surface); border-radius: 18px; padding: 12px; display: grid; gap: 10px; min-height: 108px; box-shadow: 0 3px 0 var(--line); }
.tray-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tray-sum { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.tray-items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }
.tray-items .empty { color: var(--muted); font-size: 0.95rem; align-self: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 0; background: var(--bg); font-weight: 800; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.chip .x { color: var(--muted); }
.tray.shake { animation: shake 0.35s; box-shadow: 0 0 0 3px var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.flash { font-weight: 800; font-size: 0.95rem; min-height: 1.3em; }
.flash.bad { color: var(--bad); }
.flash.good { color: var(--good); }

/* Gaveta do caixa */
.drawer { display: grid; gap: 10px; }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.coins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; justify-items: center; }
/* Cédulas ilustradas: cor da nota, moldura, padrão de linhas, valor e o animal */
.note {
  border: 0; border-radius: 12px; aspect-ratio: 2 / 1; max-width: 100%; color: #fff; padding: 0;
  position: relative; overflow: hidden; text-align: left;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 7px),
    radial-gradient(circle at 78% 50%, rgba(255,255,255,0.35) 0 28%, transparent 29%),
    linear-gradient(160deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 100%),
    var(--nc);
  box-shadow: 0 4px 0 rgba(31,43,82,0.3);
}
.note::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 8px; pointer-events: none; }
.note .v { position: absolute; left: 9px; top: 5px; font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
.note .rs { font-size: 0.7rem; margin-right: 1px; vertical-align: 0.45em; }
.note .a { position: absolute; left: 9px; bottom: 6px; max-width: 58%; white-space: nowrap; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.95; }
.note svg { position: absolute; right: 3px; top: 50%; width: 40%; height: 84%; transform: translateY(-50%); }
.note:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(31,43,82,0.3); }

/* Moedas desenhadas, com tamanhos diferentes como as de verdade */
.coin { border: 0; padding: 0; background: none; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.coin svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 0 rgba(20,26,50,0.35)); }
.coin:active svg { transform: translateY(3px); filter: drop-shadow(0 1px 0 rgba(20,26,50,0.35)); }
.coins { align-items: center; }
.coin[data-c="100"] { max-width: 66px; }
.coin[data-c="25"] { max-width: 62px; }
.coin[data-c="50"] { max-width: 59px; }
.coin[data-c="5"] { max-width: 57px; }
.coin[data-c="10"] { max-width: 53px; }

/* Na mão: mini nota ou moeda ao lado do valor */
.chip .mini { width: 26px; height: 16px; flex: none; }
.chip .mini.round { width: 18px; height: 18px; }

/* Níveis */
.levels { display: grid; gap: 12px; }
.level {
  border: 0; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); box-shadow: 0 5px 0 var(--line); width: 100%;
}
.level:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.level[data-lv="iniciante"] { background: #e6f8ec; box-shadow: 0 5px 0 #a9dfbb; }
.level[data-lv="intermediario"] { background: #fff0dc; box-shadow: 0 5px 0 #f3c98d; }
.level[data-lv="avancado"] { background: #ffe4ea; box-shadow: 0 5px 0 #f3a9b9; }
.level.locked { filter: grayscale(0.8); opacity: 0.6; }
.level .lv-emoji { font-size: 2.6rem; line-height: 1; flex: none; }
.level .lv-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.level strong { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; }
.level small { font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.level .lv-stars { font-size: 1.1rem; flex: none; }
.lv-stars .off, .unlock .off { filter: grayscale(1); opacity: 0.3; }
.unlock { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--accent-dark); }
.toggles { display: flex; gap: 8px; justify-content: center; }
.toggle { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--surface); font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.toggle[aria-pressed="false"] { opacity: 0.55; }

/* Resultado */
.celebrate { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 4px 0 var(--line); }
.stars { font-size: 2.6rem; letter-spacing: 4px; line-height: 1; }
.stars .off { filter: grayscale(1); opacity: 0.3; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.stat { background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; font-weight: 800; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 4px 0 var(--line); }
.card.daily { background: #fff7d6; box-shadow: 0 4px 0 #f0d98a; }
.countdown { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
details.card summary { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; cursor: pointer; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 2px solid var(--bg); white-space: nowrap; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
td.ok { color: var(--good); font-weight: 800; }
td.meh { color: var(--warn); font-weight: 800; }
.note-box { font-size: 0.9rem; color: var(--muted); border-left: 4px solid var(--sun); padding-left: 10px; }
.share-text { width: 100%; font: inherit; font-size: 0.9rem; padding: 10px; border-radius: 14px; border: 0; background: var(--bg); color: var(--ink); resize: none; }
a { color: var(--accent-dark); }
tr.me td { font-weight: 800; color: var(--accent-dark); }
.toplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.toplist li { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 2px solid var(--bg); }
.toplist li.me { font-weight: 800; color: var(--accent-dark); }

/* Loja: parede, prateleira, cliente e balcão */
.shop {
  position: relative; height: 160px; border-radius: 22px 22px 0 0; overflow: hidden;
  background: linear-gradient(180deg, #fff1cf 0 62%, #f7dca0 62% 64%, #fff1cf 64%);
}
.shop .shelf { position: absolute; right: 12px; bottom: 34px; width: calc(100% - 160px); display: flex; justify-content: space-around; font-size: 1.4rem; }
.shop .counter { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #e98a5b; box-shadow: inset 0 5px 0 #f4a57c; }
.customer { position: absolute; left: 14px; bottom: 18px; width: 118px; height: 138px; transform-origin: 50% 100%; }
.customer.enter { animation: walkIn 0.55s cubic-bezier(.2,.9,.3,1.25); }
.customer.leave { animation: walkOut 0.4s ease-in forwards; }
.customer.bump { animation: bump 0.5s; }
.customer.nope { animation: nope 0.5s; }
@keyframes walkIn { 0% { transform: translateX(-150%); } 60% { transform: translateX(6%) translateY(-6px); } 100% { transform: translateX(0); } }
@keyframes walkOut { 30% { transform: translateY(-10px); } 100% { transform: translateX(280%) translateY(-4px); } }
@keyframes bump { 0%,100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-12px) scale(1.06); } 60% { transform: translateY(0) scale(0.97); } }
@keyframes nope { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
.say { transform-origin: 0 40%; }
.say.pop { animation: pop 0.35s 0.3s both; }
@keyframes pop { from { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.05); } to { transform: scale(1); opacity: 1; } }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; left: 22%; top: 45%; width: 8px; height: 12px; border-radius: 2px; animation: conf 0.9s ease-out forwards; }
@keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
.say {
  position: absolute; right: 12px; top: 12px; width: calc(100% - 160px); min-width: 0;
  background: var(--surface); border-radius: 16px; padding: 8px 12px; font-size: 0.95rem; line-height: 1.3;
  box-shadow: 0 3px 0 rgba(31,43,82,0.15);
}
.say::before { content: ""; position: absolute; left: -9px; top: 22px; border: 9px solid transparent; border-left: 0; border-right-color: var(--surface); }
.say .who { display: block; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; }
.say.bad { background: #ffe3e4; } .say.bad::before { border-right-color: #ffe3e4; }
.say.good { background: #dcf8e6; } .say.good::before { border-right-color: #dcf8e6; }

/* Caixa registradora */
.register {
  background: #33a39d; border-radius: 0 0 22px 22px; padding: 12px; display: grid; gap: 10px;
  box-shadow: 0 5px 0 #237a75; margin-top: -16px;
}
.lcd {
  background: #16392b; color: #7dffb2; border-radius: 12px; padding: 8px 14px;
  font-family: "VT323", ui-monospace, monospace; font-size: 1.55rem; line-height: 1.05;
  box-shadow: inset 0 3px 0 rgba(0,0,0,0.35); font-variant-numeric: tabular-nums;
}
.lcd .ln { display: flex; justify-content: space-between; gap: 10px; }
.lcd .ln.q { color: #ffe36e; }
.lcd .ln.q.bad { color: #ff8080; animation: blink 0.25s 3; }
.lcd .ln.q.ok { color: #7dffb2; }
.lcd.flick { animation: flick 0.4s; }
@keyframes flick { 0% { opacity: 0.1; } 25% { opacity: 1; } 45% { opacity: 0.3; } 100% { opacity: 1; } }
@keyframes blink { 50% { opacity: 0.2; } }
.register.shake { animation: shake 0.4s; }
.chip.pop { animation: chipPop 0.3s; }
@keyframes chipPop { from { transform: scale(0.3); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
.tray-sum.bump { animation: sumBump 0.25s; }
@keyframes sumBump { 50% { transform: scale(1.12); } }
.round-dots span { transition: background-color 0.4s; }
.register .tray { box-shadow: none; min-height: 96px; }
.keys { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.key { border: 0; border-radius: 14px; padding: 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.1; color: #fff; }
.key.clear { background: #ef6a5b; box-shadow: 0 5px 0 #b8453a; }
.key.give { background: var(--accent); box-shadow: 0 5px 0 var(--accent-dark); }
.key:active { transform: translateY(4px); box-shadow: none; }

/* Gaveta do caixa aberta */
.drawer.open {
  background: #55607e; border-radius: 18px; padding: 10px; gap: 10px;
  box-shadow: inset 0 8px 0 rgba(0,0,0,0.2), 0 4px 0 #3b4460;
}
.drawer.open .notes { background: rgba(0,0,0,0.18); border-radius: 12px; padding: 6px; }
.drawer.open .coins { background: rgba(0,0,0,0.18); border-radius: 12px; padding: 6px; }
.busy .drawer, .busy .keys, .busy .tray-items { pointer-events: none; }

/* Tela de jogo: tudo cabe na altura do celular, sem rolar.
   A loja encolhe ou cresce; caixa e gaveta têm altura fixa. */
.app.game { height: 100vh; height: 100dvh; padding-block: 8px; gap: 8px; }
.app.game header.top .brand { font-size: 1.2rem; }
.app.game .back { width: 40px; height: 40px; font-size: 1.15rem; }
.app.game .round-dots span { height: 8px; }
.app.game .shop { flex: 1 1 120px; min-height: 96px; max-height: 190px; height: auto; }
.app.game .customer { height: calc(100% - 14px); width: auto; aspect-ratio: 120 / 140; bottom: 10px; left: 10px; }
.app.game .say { top: 8px; padding: 6px 10px; font-size: 0.88rem; width: calc(100% - 44% - 20px); }
.app.game .shop .counter { height: 22px; }
.app.game .shop .shelf { display: none; }
.app.game .register { padding: 8px; gap: 8px; margin-top: -14px; flex: none; }
.app.game .lcd { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; font-size: 1.3rem; padding: 6px 12px; }
.app.game .lcd .ln.q { grid-column: 1 / -1; }
.app.game .tray { min-height: 0; padding: 8px 10px; gap: 6px; }
.app.game .tray-sum { font-size: 1.35rem; }
.app.game .tray-items { min-height: 30px; }
.app.game .chip { padding: 4px 8px; font-size: 0.85rem; }
.app.game .flash { min-height: 0; font-size: 0.85rem; }
.app.game .flash:empty { display: none; }
.app.game .key { padding: 10px; font-size: 1.05rem; }

  function productFor(price, pick) {

  function makeCustomer(seedStr, round, price) {
    let h = 2166136261;
    for (const ch of seedStr + "#" + round) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    const pick = (arr) => { h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0; return arr[h % arr.length]; };

  // Sons sintetizados (sem arquivos). Tocam só depois de um toque na tela.
  let actx = null;
  const soundOn = () => store("tc-sound") !== "off";
  function beep(freq, dur, type = "sine", delay = 0, vol = 0.12) {
    if (!soundOn()) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* sem áudio */ }
  }
  const beeps = {
    tap: () => beep(740, 0.06, "triangle", 0, 0.08),
    ok: () => { beep(988, 0.1, "square", 0, 0.06); beep(1319, 0.25, "square", 0.1, 0.06); },
    bad: () => { beep(220, 0.18, "sawtooth", 0, 0.07); beep(165, 0.25, "sawtooth", 0.15, 0.07); },
    door: () => beep(1047, 0.15, "sine", 0, 0.07),
    win: () => { [523, 659, 784, 1047].forEach((f, k) => beep(f, 0.2, "square", k * 0.12, 0.06)); },
  };
  // Sons gravados em public/sons (gerados por tools/gerar-audio.mjs)
  const SOUND_FILES = { tap: "toque", ok: "caixa", bad: "erro", door: "porta", win: "vitoria", music: "musica" };
  const buffers = {};
  function audioCtx() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    return actx;
  }
  function loadSounds() {
    const ctx = audioCtx();
    if (!ctx) return;
    for (const [key, file] of Object.entries(SOUND_FILES)) {
      fetch(`sons/${file}.mp3`)
        .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject(new Error(file))))
        .then((data) => ctx.decodeAudioData(data))
        .then((buf) => { buffers[key] = buf; if (key === "music") syncMusic(); })
        .catch(() => { /* sem o arquivo: usa os bipes */ });
    }
  }
  function play(key, vol = 1) {
    if (!soundOn()) return;
    const ctx = audioCtx();
    if (!ctx || !buffers[key]) return beeps[key] && beeps[key]();
    if (ctx.state === "suspended") ctx.resume();
    const src = ctx.createBufferSource(), g = ctx.createGain();
    g.gain.value = vol; src.buffer = buffers[key];
    src.connect(g).connect(ctx.destination); src.start();
  }
  const sfx = {
    tap: () => play("tap", 0.5), ok: () => play("ok", 0.9), bad: () => play("bad", 0.8),
    door: () => play("door", 0.6), win: () => play("win", 0.9),
  };

  // Música de fundo em loop
  const musicOn = () => store("tc-music") !== "off";
  let musicSrc = null, unlocked = false;
  function syncMusic() {
    const ctx = audioCtx();
    const want = musicOn() && unlocked && buffers.music && document.visibilityState !== "hidden";
    if (want && !musicSrc && ctx) {
      if (ctx.state === "suspended") ctx.resume();
      const g = ctx.createGain(); g.gain.value = 0.3;
      musicSrc = ctx.createBufferSource(); musicSrc.buffer = buffers.music; musicSrc.loop = true;
      musicSrc.connect(g).connect(ctx.destination); musicSrc.start();
    } else if (!want && musicSrc) {
      try { musicSrc.stop(); } catch (e) { /* já parou */ }
      musicSrc = null;
    }
  }
  // O navegador só deixa tocar som depois do primeiro toque
  document.addEventListener("pointerdown", () => {
    unlocked = true;
    const ctx = audioCtx();
    if (ctx && ctx.state === "suspended") ctx.resume();
    syncMusic();
  }, { once: true, capture: true });
  // App em segundo plano: silêncio total
  document.addEventListener("visibilitychange", () => {
    const ctx = audioCtx();
    if (!ctx) return;
    if (document.visibilityState === "hidden") ctx.suspend(); else { ctx.resume(); }
    syncMusic();
  });
  function togglesHtml() {
    return `<div class="toggles">
      <button class="toggle" id="tMusic" aria-pressed="${musicOn()}">🎵 Música</button>
      <button class="toggle" id="tSound" aria-pressed="${soundOn()}">🔊 Sons</button>
    </div>`;
  }
  function bindToggles() {
    document.getElementById("tMusic").addEventListener("click", (e) => {
      store("tc-music", musicOn() ? "off" : "on"); e.currentTarget.setAttribute("aria-pressed", musicOn()); unlocked = true; syncMusic();
    });
    document.getElementById("tSound").addEventListener("click", (e) => {
      store("tc-sound", soundOn() ? "off" : "on"); e.currentTarget.setAttribute("aria-pressed", soundOn()); sfx.tap();
    });
  }
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* ok */ } };

  function confetti(host) {
    const box = document.createElement("div");
    box.className = "confetti";
    const colors = ["#ff6b9a", "#ffc93c", "#22b35e", "#4fb3ff", "#9b6bff"];
    for (let k = 0; k < 22; k++) {
      const i = document.createElement("i");
      i.style.background = colors[k % colors.length];
      i.style.setProperty("--dx", (Math.random() * 300 - 60) + "px");
      i.style.setProperty("--dy", (Math.random() * -120 - 10) + "px");
      i.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      box.appendChild(i);
    }
    host.appendChild(box);
    setTimeout(() => box.remove(), 1000);
  }

  const brandHtml = () => `<span class="brand">${mascot("happy", "")}Troco Certo</span>`;
  const isPerfect = (r) => r.wrong === 0 && r.pieces === r.best;
  function starsOf(results) {
    const p = results.filter(isPerfect).length;
    return p === 5 ? 3 : p >= 3 ? 2 : 1;
  }

  function store(key, val) {
    try {
      if (val === undefined) { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }

  const todayKey = () => dayKey();
  const ddmm = (day) => day.slice(8, 10) + "/" + day.slice(5, 7); // "2026-09-29" -> "29/09"


  // ---------- Estado ----------
  const app = document.getElementById("app");
  let S = null;       // partida em andamento
  let tick = null;

  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }

  // ---------- Telas ----------
  function renderStart() {
    app.classList.remove("game");
    stopTick();
    const uf = store("tc-uf") || "SP";
    const played = store("tc-day-" + todayKey());
    const paused = pausedGame();
    const main = played ? "⭐ Ver meu resultado"
      : paused ? `▶ Continuar (cliente ${paused.i + 1} de 5)` : "▶ Desafio do dia";
    app.replaceChildren(el(`
      <header class="top">${brandHtml()}<span class="pill num">${ddmm(todayKey())}</span></header>
      <section class="hero">
        <div class="talk">
          ${mascot("happy", "mascot bob")}
          <p class="bubble">Oi! Eu sou a <strong>Moedinha</strong>. Me ajuda a dar o troco certo pros clientes?</p>
        </div>
        <h1>Você é bom de troco?</h1>
      </section>
      <ol class="how">
        <li><span class="ico">🛒</span><span>Veja quanto custou e quanto o cliente pagou</span></li>
        <li><span class="ico">🪙</span><span>Toque nas notas e moedas pra montar o troco</span></li>
        <li><span class="ico">⏱️</span><span>Seja rápido! Errou? Ganha +5 segundos</span></li>
      </ol>
      <label class="field" for="uf">📍 Seu estado
        <select id="uf">${UFS.map((u) => `<option ${u === uf ? "selected" : ""}>${u}</option>`).join("")}</select>
      </label>
      <button class="btn" id="go">${main}<small>${played ? "você já jogou hoje!" : "vale pro ranking · 1 vez por dia"}</small></button>
      ${paused ? `<p class="pause-note">O relógio continua de onde parou.</p>` : ""}
      <button class="btn sun" id="levels">🎮 Níveis<small>iniciante, intermediário e avançado</small></button>
      ${togglesHtml()}
    `));
    bindToggles();
    document.getElementById("uf").addEventListener("change", (e) => store("tc-uf", e.target.value));
    document.getElementById("go").addEventListener("click", () => {
      enterScreen();
      if (played) renderResult(played); else startGame(null);
    });
    document.getElementById("levels").addEventListener("click", () => { enterScreen(); renderLevels(); });
  }

  // ---------- Níveis ----------
  const bestOf = (k) => Number(store("tc-level-" + k)) || 0;
  const isOpen = (k) => { const i = LEVEL_ORDER.indexOf(k); return i === 0 || bestOf(LEVEL_ORDER[i - 1]) > 0; };
  const starsHtml = (n) => `${"⭐".repeat(n)}<span class="off">${"⭐".repeat(3 - n)}</span>`;

  function renderLevels() {
    app.classList.remove("game");
    stopTick();
    app.replaceChildren(el(`
      <header class="top">
        <span class="left"><button class="back" id="back" aria-label="Voltar ao início">←</button><span class="brand">🎮 Níveis</span></span>
      </header>
      <div class="talk">
        ${mascot("happy", "mascot bob")}
        <p class="bubble">Escolha um nível! Termine um pra liberar o próximo. Aqui não tem ranking: jogue quantas vezes quiser.</p>
      </div>
      <div class="levels">${LEVEL_ORDER.map((k, i) => {
        const L = LEVELS[k], open = isOpen(k);
        return `<button class="level${open ? "" : " locked"}" data-lv="${k}" ${open ? "" : "disabled"}>
          <span class="lv-emoji">${open ? L.emoji : "🔒"}</span>
          <span class="lv-body"><strong>${L.name}</strong>
            <small>${open ? L.desc : `Termine o ${LEVELS[LEVEL_ORDER[i - 1]].name} pra liberar`}</small></span>
          <span class="lv-stars" aria-label="Recorde: ${bestOf(k)} de 3 estrelas">${starsHtml(bestOf(k))}</span>
        </button>`;
      }).join("")}</div>
      ${togglesHtml()}
    `));
    bindToggles();
    document.getElementById("back").addEventListener("click", goBack);
    app.querySelectorAll(".level:not(.locked)").forEach((b) => b.addEventListener("click", () => { sfx.tap(); startGame(b.dataset.lv); }));
  }

  // ---------- Navegação (botão voltar da tela e do Android) ----------
  // Cada tela aberta a partir do início ganha uma entrada no histórico;
  // voltar (pelo botão ou pelo Android) sempre leva ao início.
  let pushed = false;
  function enterScreen() {
    if (!pushed) { try { history.pushState({ tc: 1 }, ""); pushed = true; } catch (e) { /* sem histórico */ } }
  }
  function goBack() {
    if (pushed) history.back(); else toStart();
  }
  function toStart() {
    pushed = false;
    if (S) leaveGame(); else renderStart();
  }
  window.addEventListener("popstate", toStart);

  // ---------- Pausar e continuar o desafio do dia ----------
  function pauseKey() { return "tc-pause-" + todayKey(); }
  function pausedGame() {
    const p = store(pauseKey());
    return p && p.day === todayKey() ? p : null;
  }
  function saveProgress() {
    if (!S || S.training) return;
    const t = now();
    store(pauseKey(), {
      day: S.day, i: S.busy ? S.i + 1 : S.i, results: S.results, wrong: S.wrong, roundWrong: S.roundWrong || 0,
      gameElapsed: t - S.gameStart, roundElapsed: S.busy ? 0 : t - S.roundStart,
    });
  }
  function clearProgress() { try { localStorage.removeItem(pauseKey()); } catch (e) { /* ok */ } }
  function leaveGame() {
    saveProgress();
    app.classList.remove("busy");
    S = null;
    renderStart();
  }
  // Se o app for fechado no meio, o progresso fica salvo
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveProgress(); });
  window.addEventListener("pagehide", saveProgress);

  // level = null para o desafio do dia, ou "iniciante" / "intermediario" / "avancado"
  function startGame(level) {
    const training = !!level;
    const seed = training ? `nivel-${level}-${Date.now()}` : dailySeed(todayKey());
    S = {
      training, level, seed, rounds: makeRounds(seed, training ? LEVELS[level].tiers : undefined), i: 0, tray: {}, results: [],
      wrong: 0, roundStart: performance.now(), gameStart: performance.now(),
      uf: store("tc-uf") || "SP", day: todayKey(),
    };
    const paused = training ? null : pausedGame();
    if (paused) {
      const now = performance.now();
      Object.assign(S, {
        i: paused.i, results: paused.results, wrong: paused.wrong, roundWrong: paused.roundWrong,
        gameStart: now - paused.gameElapsed, roundStart: now - paused.roundElapsed,
      });
    }
    if (S.i >= S.rounds.length) return finish();
    renderRound();
    startTick();
  }

  function traySum() { return Object.entries(S.tray).reduce((a, [c, n]) => a + Number(c) * n, 0); }
  function trayCount() { return Object.values(S.tray).reduce((a, n) => a + n, 0); }

  function askText(c, r) { return `Quero ${c.item}! Toma ${brl(r.paid)}.`; }

  function setCustomer(mood, text, kind = "", anim = "") {
    const c = makeCustomer(S.seed, S.i, S.rounds[S.i].price);
    document.getElementById("cust").innerHTML = customerSvg(c, mood, anim);
    const say = document.getElementById("say");
    say.className = "say " + kind;
    say.innerHTML = `<span class="who">${c.name} · cliente ${S.i + 1} de 5</span>${text}`;
  }

  const retrigger = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

  // Monta a tela do caixa uma vez; depois só o cliente e o visor mudam
  function renderRound() {
    app.classList.add("game");
    app.replaceChildren(el(`
      <header class="top">
        <span class="left">
          <button class="back" id="back" aria-label="${S.training ? "Sair do nível" : "Pausar e voltar ao início"}">←</button>
          <span class="brand">${S.training ? LEVELS[S.level].emoji + " " + LEVELS[S.level].name : "Desafio do dia"}</span>
        </span>
        <span class="left">
          <button class="back" id="sound" aria-label="Ligar ou desligar o som">${soundOn() ? "🔊" : "🔇"}</button>
          <span class="pill num" id="clock">0,0s</span>
        </span>
      </header>
      <div class="round-dots" id="dots">${S.rounds.map(() => "<span></span>").join("")}</div>
      <section class="shop" id="shop">
        <div class="shelf" aria-hidden="true"><span>🧃</span><span>🍎</span><span>🧸</span><span>🍞</span><span>🎈</span></div>
        <div id="cust"></div>
        <p class="say" id="say" aria-live="polite"></p>
        <div class="counter"></div>
      </section>
      <section class="register" id="register">
        <div class="lcd" id="lcd" aria-label="Visor do caixa">
          <div class="ln"><span>TOTAL</span><span id="lcdTotal"></span></div>
          <div class="ln"><span>PAGO</span><span id="lcdPaid"></span></div>
          <div class="ln q" id="lcdChangeLn"><span>TROCO</span><span id="lcdChange">?</span></div>
        </div>
        <div class="tray" id="tray">
          <div class="tray-head"><span class="eyebrow">Troco na mão</span><span class="tray-sum" id="sum">R$ 0,00</span></div>
          <div class="tray-items" id="items"></div>
          <div class="flash" id="flash" aria-live="polite"></div>
        </div>
        <div class="keys">
          <button class="key clear" id="clear">Limpar</button>
          <button class="key give" id="give">Entregar troco ✋</button>
        </div>
      </section>
      <section class="drawer open" aria-label="Gaveta do caixa">
        <div class="notes">${DENOMS.filter((d) => d.kind === "note").map((d) => `
          <button class="note" data-c="${d.c}" style="--nc:${d.color}" aria-label="Nota de ${brl(d.c)}">
            <span class="v"><span class="rs">R$</span>${d.c / 100}</span><span class="a">${d.animal}</span>${noteSvg(d.c)}
          </button>`).join("")}
        </div>
        <div class="coins">${DENOMS.filter((d) => d.kind === "coin").map((d) => `
          <button class="coin" data-c="${d.c}" aria-label="Moeda de ${brl(d.c)}">${coinSvg(d.c)}</button>`).join("")}
        </div>
      </section>
    `));
    app.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => addPiece(Number(b.dataset.c))));
    document.getElementById("clear").addEventListener("click", () => { if (S.busy) return; sfx.tap(); S.tray = {}; paintTray(); });
    document.getElementById("give").addEventListener("click", deliver);
    document.getElementById("back").addEventListener("click", goBack);
    document.getElementById("sound").addEventListener("click", (e) => {
      store("tc-sound", soundOn() ? "off" : "on");
      e.currentTarget.textContent = soundOn() ? "🔊" : "🔇";
      sfx.tap();
    });
    showCustomer();
    paintClock();
  }

  // Um cliente novo chega ao caixa
  function showCustomer() {
    const r = S.rounds[S.i], c = makeCustomer(S.seed, S.i, S.rounds[S.i].price);
    document.querySelectorAll("#dots span").forEach((d, k) => { d.className = k < S.i ? "done" : k === S.i ? "now" : ""; });
    document.getElementById("shop").setAttribute("aria-label", `Cliente ${S.i + 1} de 5`);
    setCustomer("normal", askText(c, r), "", "enter");
    retrigger(document.getElementById("say"), "pop");
    document.getElementById("lcdTotal").textContent = brl(r.price);
    document.getElementById("lcdPaid").textContent = brl(r.paid);
    document.getElementById("lcdChange").textContent = "?";
    document.getElementById("lcdChangeLn").className = "ln q";
    retrigger(document.getElementById("lcd"), "flick");
    S.tray = {}; S.lastAdded = null;
    paintTray(); flash("", "");
  }

  function addPiece(c) { if (S.busy) return; sfx.tap(); S.tray[c] = (S.tray[c] || 0) + 1; S.lastAdded = c; paintTray(); }
  function removePiece(c) { if (S.busy) return; sfx.tap(); S.lastAdded = null; S.tray[c]--; if (S.tray[c] <= 0) delete S.tray[c]; paintTray(); }

  function paintTray() {
    const sumEl = document.getElementById("sum");
    sumEl.textContent = brl(traySum());
    if (S.lastAdded) retrigger(sumEl, "bump");
    const items = document.getElementById("items");
    const entries = Object.entries(S.tray).sort((a, b) => b[0] - a[0]);
    if (!entries.length) { items.innerHTML = `<span class="empty">Toque nas notas e moedas 👇</span>`; return; }
    items.replaceChildren(...entries.map(([c, n]) => {
      const b = document.createElement("button");
      b.className = "chip" + (Number(c) === S.lastAdded ? " pop" : "");
      b.setAttribute("aria-label", `Tirar uma de ${brl(Number(c))}`);
      b.innerHTML = `${miniSvg(Number(c))}${n > 1 ? n + "× " : ""}${brl(Number(c))} <span class="x">×</span>`;
      b.addEventListener("click", () => removePiece(Number(c)));
      return b;
    }));
  }

  function flash(msg, kind) {
    const f = document.getElementById("flash");
    f.textContent = msg; f.className = "flash " + kind;
  }

  const now = () => (S && S.pausedAt) || performance.now();

  function deliver() {
    if (S.busy) return;
    const r = S.rounds[S.i];
    const sum = traySum();
    const lcdLn = document.getElementById("lcdChangeLn"), lcdVal = document.getElementById("lcdChange");
    if (sum !== r.change) {
      S.wrong++;
      S.roundWrong = (S.roundWrong || 0) + 1;
      sfx.bad(); buzz(200);
      retrigger(document.getElementById("register"), "shake");
      lcdVal.textContent = "ERRO!";
      lcdLn.className = "ln q"; retrigger(lcdLn, "bad");
      flash(S.level === "iniciante" ? `Dica: o troco é ${brl(r.change)} 😉 (+5s)` : "Tente de novo! (+5s)", "bad");
      setCustomer("sad", sum > r.change ? "Hmm... você me deu troco a mais! 🤔" : "Hmm... acho que faltou troco! 🤔", "bad", "nope");
      const cur = S, round = S.i, token = (S.token = (S.token || 0) + 1);
      setTimeout(() => {
        if (S !== cur || S.i !== round || S.token !== token || S.busy) return;
        setCustomer("normal", askText(makeCustomer(S.seed, S.i, r.price), r));
        lcdVal.textContent = "?"; lcdLn.className = "ln q";
      }, 1600);
      return;
    }
    const t = performance.now();
    const pieces = trayCount(), best = minPieces(r.change);
    S.results.push({ ...r, ms: t - S.roundStart, pieces, best, wrong: S.roundWrong || 0, tray: { ...S.tray } });
    S.roundWrong = 0;
    // O relógio para enquanto o cliente comemora e vai embora
    S.busy = true; S.pausedAt = t;
    app.classList.add("busy");
    sfx.ok(); buzz(40);
    lcdVal.textContent = brl(r.change) + " ✓";
    lcdLn.className = "ln q ok";
    flash("", "");
    setCustomer("happy", "Valeu! Troco certinho! 😄", "good", "bump");
    confetti(document.getElementById("shop"));
    const cur = S;
    setTimeout(() => { if (S === cur) document.querySelector(".customer").classList.add("leave"); }, 800);
    setTimeout(() => {
      if (S !== cur) return;
      app.classList.remove("busy");
      const resume = performance.now();
      S.gameStart += resume - S.pausedAt;
      S.pausedAt = null; S.busy = false;
      S.i++; S.roundStart = resume;
      if (S.i >= S.rounds.length) return finish();
      saveProgress();
      sfx.door();
      showCustomer();
    }, 1200);
  }

  function finish() {
    stopTick();
    const res = { day: S.day, uf: S.uf, training: S.training, level: S.level, results: S.results, score: scoreOf(S.results) };
    if (!S.training) { store("tc-day-" + S.day, res); clearProgress(); }
    if (S.level) {
      const next = LEVEL_ORDER[LEVEL_ORDER.indexOf(S.level) + 1];
      const wasOpen = next ? isOpen(next) : true;
      store("tc-level-" + S.level, Math.max(bestOf(S.level), starsOf(S.results)));
      if (next && !wasOpen && isOpen(next)) res.unlocked = next;
    }
    S = null;
    sfx.win();
    renderResult(res);
  }

  function squares(results) { return results.map((r) => (r.wrong === 0 && r.pieces === r.best) ? "🟩" : "🟨").join(""); }

  function shareText(res) {
    return `Troco Certo ${ddmm(res.day)} (${res.uf})\n${squares(res.results)}\n⏱️ ${fmtTime(res.score.total)}\nVocê é bom de troco?`;
  }

  function nextLevel(res) {
    if (!res.level) return null;
    const next = LEVEL_ORDER[LEVEL_ORDER.indexOf(res.level) + 1];
    return next && isOpen(next) ? next : null;
  }

  function renderResult(res) {
    app.classList.remove("game");
    const sc = res.score;
    const perfect = res.results.filter(isPerfect).length;
    const stars = starsOf(res.results);
    const cheer = stars === 3 ? "Incrível! Troco perfeito!" : stars === 2 ? "Mandou bem!" : "Boa! Treine e fique ainda melhor!";
    const rows = res.results.map((r, k) => {
      const ok = isPerfect(r);
      return `<tr><td>${k + 1}</td><td>${brl(r.price)}</td><td>${brl(r.paid)}</td><td>${brl(r.change)}</td>
        <td class="${ok ? "ok" : "meh"}">${r.pieces}/${r.best}${r.wrong ? " · " + r.wrong + "✗" : ""}</td><td>${secs(r.ms)}</td></tr>`;
    }).join("");
    const text = shareText(res);
    app.replaceChildren(el(`
      <header class="top">
        <span class="left"><button class="back" id="back" aria-label="Voltar ao início">←</button>${brandHtml()}</span>
        <span class="pill num">${res.level ? LEVELS[res.level].emoji + " " + LEVELS[res.level].name : ddmm(res.day)}</span>
      </header>
      <section class="celebrate">
        ${mascot(stars === 3 ? "wow" : "happy", "mascot bob")}
        <h1>${cheer}</h1>
        <div class="stars" aria-label="${stars} de 3 estrelas">${"⭐".repeat(stars)}<span class="off">${"⭐".repeat(3 - stars)}</span></div>
        <div class="score">${fmtTime(sc.total)}</div>
        <div class="stats">
          <span class="stat">✅ ${perfect} de 5 perfeitos</span>
          ${sc.wrong ? `<span class="stat">❌ ${sc.wrong} ${sc.wrong === 1 ? "erro" : "erros"} (+${sc.wrong * 5}s)</span>` : ""}
          ${sc.extra ? `<span class="stat">🪙 ${sc.extra} ${sc.extra === 1 ? "peça" : "peças"} a mais (+${sc.extra * 2}s)</span>` : ""}
        </div>
      </section>
      ${res.level ? `
      <section class="card daily">
        <h2>${LEVELS[res.level].emoji} Nível ${LEVELS[res.level].name}</h2>
        <p>Seu recorde neste nível: <span class="lv-stars">${starsHtml(bestOf(res.level))}</span></p>
        ${res.unlocked ? `<p class="unlock">🔓 Você liberou o nível ${LEVELS[res.unlocked].emoji} ${LEVELS[res.unlocked].name}!</p>` : ""}
        <p>Os níveis não contam pro ranking. Jogue quantas vezes quiser!</p>
      </section>` : `
      <section class="card daily">
        <h2>📅 Como funciona o desafio do dia</h2>
        <p>Todo mundo do Brasil recebe os <strong>mesmos 5 clientes</strong> no dia. Ele vale <strong>1 vez por dia</strong> pro ranking, pra ser justo com todos.</p>
        <p>Um desafio novo chega em:</p>
        <div class="countdown" id="next">--:--:--</div>
        <p>Enquanto isso, <strong>jogue os níveis quantas vezes quiser</strong>!</p>
      </section>
      <section class="card">
        <h2>📣 Mostre pros amigos</h2>
        <textarea class="share-text" id="sharetxt" rows="4" readonly>${text}</textarea>
        <div class="row">
          <button class="btn small" id="copy">Copiar</button>
          <a class="btn ghost small" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
        <p class="flash good" id="copied" aria-live="polite"></p>
      </section>
      <section class="card" id="rank" aria-live="polite">
        <h2>🏆 Ranking de hoje</h2>
        <p class="muted">Buscando o ranking…</p>
      </section>`}
      <details class="card">
        <summary>🧾 Ver cliente por cliente</summary>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Compra</th><th>Pagou</th><th>Troco</th><th>Peças</th><th>Tempo</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p class="muted" style="font-size:.85rem">Peças: quantas você usou / o mínimo possível.</p>
      </details>
      ${nextLevel(res) ? `<button class="btn" id="nextLv">▶ Próximo: ${LEVELS[nextLevel(res)].emoji} ${LEVELS[nextLevel(res)].name}</button>` : ""}
      <div class="row">
        ${res.level ? `<button class="btn sun" id="again">🔁 De novo</button>` : `<button class="btn sun" id="levels">🎮 Níveis</button>`}
        <button class="btn ghost" id="home">🏠 Início</button>
      </div>
    `));
    const on = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener("click", fn); };
    on("nextLv", () => startGame(nextLevel(res)));
    on("again", () => startGame(res.level));
    on("levels", () => { enterScreen(); renderLevels(); });
    document.getElementById("home").addEventListener("click", goBack);
    document.getElementById("back").addEventListener("click", goBack);
    const copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", () => {
      const done = () => { document.getElementById("copied").textContent = "Resultado copiado. Cole no grupo!"; };
      const fallback = () => { const t = document.getElementById("sharetxt"); t.focus(); t.select(); document.getElementById("copied").textContent = "Texto selecionado. Copie e cole no grupo."; };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
    if (!res.training) { startCountdown(res); syncRanking(res); }
  }

  // ---------- Ranking (servidor) ----------
  function playerId() {
    let id = store("tc-player");
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12));
      store("tc-player", id);
    }
    return id;
  }

  async function api(path, opts) {
    const r = await fetch((window.TROCO_API || "") + path, { headers: { "Content-Type": "application/json" }, ...opts });
    const data = await r.json().catch(() => ({}));
    return { status: r.status, data };
  }

  async function syncRanking(res) {
    const box = document.getElementById("rank");
    try {
      let ranking;
      if (!res.sent) {
        const body = { day: res.day, uf: res.uf, playerId: playerId(), rounds: res.results.map((r) => ({ pieces: r.tray || {}, ms: r.ms, wrong: r.wrong })) };
        const { status, data } = await api("api/resultado", { method: "POST", body: JSON.stringify(body) });
        if (status === 201 || status === 409) { res.sent = true; store("tc-day-" + res.day, res); ranking = data.ranking; }
        else if (status === 400) { res.sent = true; store("tc-day-" + res.day, res); throw new Error(data.error || "Resultado recusado."); }
        else throw new Error("offline");
      }
      if (!ranking) {
        const q = new URLSearchParams({ day: res.day, uf: res.uf, playerId: playerId() });
        const { status, data } = await api("api/ranking?" + q);
        if (status !== 200) throw new Error("offline");
        ranking = data;
      }
      if (document.body.contains(box)) paintRanking(box, ranking, res.uf);
    } catch (e) {
      if (!document.body.contains(box)) return;
      const msg = e.message && e.message !== "offline" && !(e instanceof TypeError)
        ? "Seu resultado não entrou no ranking. Motivo: " + e.message
        : "Sem conexão com o servidor do ranking. Seu resultado fica guardado aqui e é enviado na próxima vez que você abrir o jogo com internet.";
      box.innerHTML = `<h2>🏆 Ranking de hoje</h2><p class="note-box">${msg}</p>`;
    }
  }

  function paintRanking(box, r, uf) {
    const ord = (n) => n + "º";
    const you = r.voce
      ? `<p><strong>Você:</strong> ${r.voce.posicaoUf ? ord(r.voce.posicaoUf) + " de " + r.totalUf + " em " + uf + " · " : ""}${ord(r.voce.posicaoBrasil)} de ${r.totalBrasil} no Brasil</p>`
      : `<p class="muted">${r.totalBrasil} pessoa(s) jogaram hoje.</p>`;
    const mine = r.estados.find((e) => e.uf === uf);
    const top = r.estados.slice(0, 10);
    if (mine && !top.includes(mine)) top.push(mine);
    const rows = top.map((e) => `<tr${e.uf === uf ? ' class="me"' : ""}>
        <td>${e.posicao ? ord(e.posicao) : "—"}</td><td>${e.uf}</td><td>${e.jogadores}</td><td>${fmtTime(e.media)}</td></tr>`).join("");
    const tops = r.topUf.map((p) => `<li${p.voce ? ' class="me"' : ""}><span>${ord(p.posicao)}</span><span>${fmtTime(p.score)}${p.voce ? " (você)" : ""}</span></li>`).join("");
    box.innerHTML = `
      <h2>🏆 Ranking de hoje</h2>
      ${you}
      <p class="eyebrow">Placar dos estados (média de tempo)</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Pos.</th><th>UF</th><th>Jogadores</th><th>Média</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4" class="muted">Ninguém jogou ainda.</td></tr>`}</tbody>
      </table></div>
      <p class="muted" style="font-size:.85rem">Um estado entra no placar com pelo menos ${r.minJogadoresEstado} jogadores.</p>
      ${tops ? `<p class="eyebrow">Mais rápidos de ${uf}</p><ol class="toplist">${tops}</ol>` : ""}`;
  }

  function startCountdown(res) {
    const n = document.getElementById("next");
    const paint = () => {
      if (!document.body.contains(n)) return stopTick();
      let s = Math.floor(msToNextDay() / 1000);
      if (res.day !== todayKey()) return boot();
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); s %= 60;
      n.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    };
    stopTick(); paint(); tick = setInterval(paint, 1000);
  }

  // ---------- Relógio ----------
  function paintClock() {
    const c = document.getElementById("clock");
    if (!c || !S) return;
    const penalty = S.wrong * WRONG_PENALTY;
    c.textContent = secs(now() - S.gameStart + penalty);
  }
  function startTick() { stopTick(); tick = setInterval(paintClock, 100); }
  function stopTick() { if (tick) clearInterval(tick); tick = null; }

  function boot() {
    if (!Object.keys(buffers).length) loadSounds();
    const played = store("tc-day-" + todayKey());
    renderStart();
    // Resultado de hoje que ainda não chegou ao servidor: tenta enviar em segundo plano
    if (played && !played.sent) syncRanking(played);
  }
  boot();
})();
</script>
</body>
